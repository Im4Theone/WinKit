        const issues = issueCount(), healthy = showSummary && issues === 0;
        sumCard.classList.toggle('wk-hide', !showSummary);
        sumCard.classList.toggle('ok', healthy); sumCard.classList.toggle('bad', issues > 0 && count('Failed') > 0); sumCard.classList.toggle('warn', issues > 0 && count('Failed') === 0);
        sumText.textContent = healthy ? 'No issues found. Your system is running normally.' : issues + (issues === 1 ? ' issue found' : ' issues found');
        sumCounts.textContent = count('Passed') + ' passed · ' + count('Warning') + ' warnings · ' + count('Failed') + ' failed';
        reviewBtn.classList.toggle('wk-hide', healthy);
        onlyBox.checked = showOnlyIssues;
        runCard.classList.toggle('wk-hide', !running);
        cancelBtn.classList.toggle('wk-hide', !running);
        runBtn.disabled = fixRunning;
        runCount.textContent = '(' + items.length + ' checks completed)';
        runBar.style.width = Math.min(100, Math.round(items.length / (total || 11) * 100)) + '%';
        runCur.textContent = currentCheck ? 'Checking ' + currentCheck + '...' : '';
        runCur.classList.toggle('wk-hide', !currentCheck);
      }

      // ---- scan ----
      function setResults(results) {
        const old = new Map(items.map((i) => [i.result.checkId, i]));
        items = (results || []).map((r) => { const o = old.get(r.checkId); return o && o.result === r ? o : buildItem(r); });
      }
      async function run() {
        if (running || fixRunning) return;
        running = true; items = []; currentCheck = null; updateAllItems(); renderList();
        let res = null, err = null;
        try { res = await WK.native('diag_run_all'); } catch (e) { err = e; }
        running = false; currentCheck = null;
        if (err) {
          renderList();
          WK.alert('Diagnostics couldn\'t run', msgOf(err));
          return;
        }
        if (res && Array.isArray(res.results)) setResults(res.results);
        const cancelled = !!(res && res.cancelled);
        if (cancelled) {
          WK.activity.record('Diagnostics scan cancelled', 'Info');
        } else {
          hasRun = true;
          const n = issueCount();
          if (n === 0) WK.activity.record('Diagnostics completed - no issues found', 'Success');
          else WK.activity.record('Diagnostics completed - ' + n + ' issue(s) found', 'Warning');
        }
        updateAllItems(); renderList();
      }

      // ---- actions ----
      async function onAct(it) {
        const action = it.result.fixAction;
        if (!action) return;
        if (it.busy) { WK.native('diag_cancel', { target: 'fix' }).catch(() => {}); return; }
        if (running || fixRunning || acting) return;
        acting = true;
        let ok;
        try {
          ok = await WK.confirm({
            title: action.label + ' - ' + it.result.name,
            message: (action.confirmationMessage || '') + (action.requiresElevation ? ' Windows may prompt for administrator permission.' : ''),
            confirmText: action.label, isDestructive: !!action.isDestructive
          });
        } finally { acting = false; }
        if (!ok) return;
        if (action.kind === 'Review') { navigateForReview(it.result); return; }

        fixRunning = true; it.busy = true; it.statusMessage = null; it.log = [];
        updateAllItems(); renderChrome();
        try {
          const r = await WK.native('diag_fix', { checkId: it.result.checkId });
          if (r && r.cancelled) {
            WK.activity.record(it.result.name + ': fix cancelled', 'Info');
          } else if (r && r.success) {
            const summary = r.message || 'Completed.';
            WK.activity.record(it.result.name + ': ' + summary, 'Success');
            WK.toast(it.result.name, summary, 'Success');
            if (r.note) WK.toast('Note', r.note, 'Warning');
          } else {
            WK.activity.record(it.result.name + ': fix failed', 'Error');
            await WK.alert(action.label + ' failed', (r && r.message) || 'Unknown error.', r && r.technicalDetail);
          }
        } catch (e) {
          WK.activity.record(it.result.name + ': fix failed', 'Error');
          await WK.alert(action.label + ' failed', msgOf(e));
        } finally {
          it.busy = false; it.statusMessage = null; it.log = []; fixRunning = false;
          updateAllItems(); renderChrome();
        }
        await run();
      }
      function navigateForReview(r) {
        const t = r.fixAction && r.fixAction.reviewTarget;
        const id = r.checkId;
        if (t === 'startup-manager' || id === 'startup') WK.nav.go('system', { tab: 'startup', tabTitle: 'Startup Manager' });
        else if (t === 'services-manager' || id === 'services') WK.nav.go('system', { tab: 'services', tabTitle: 'Services' });
        else if (t === 'cleanup' || id === 'disk-space') WK.nav.go('cleanup');
      }

      // ---- events ----
      const byId = (id) => items.find((i) => i.result.checkId === id);
      function subscribe() {
        unsubscribe();
        unsubs.push(
          WK.on('diag_check_started', (d) => { if (!running || !d) return; currentCheck = d.name; if (d.total) total = d.total; renderChrome(); }),
          WK.on('diag_progress', (d) => {
            if (!running || !d || !d.result) return;
            if (d.total) total = d.total;
            if (!byId(d.result.checkId)) items.push(buildItem(d.result));
            renderList();
          }),
          WK.on('diag_fix_progress', (d) => { const it = d && byId(d.checkId); if (it) { it.statusMessage = d.message || null; updateItem(it); } }),
          WK.on('diag_fix_output', (d) => {
            const it = d && byId(d.checkId); if (!it || !it.busy) return;
            it.log.push(String(d.line == null ? '' : d.line).replace(/[\r\n]+$/, ''));
            if (it.log.length > 200) it.log.splice(0, it.log.length - 200);
            updateItem(it);
          }),
          WK.on('diag_fix_finished', (d) => { const it = d && byId(d.checkId); if (it) { it.statusMessage = null; updateItem(it); } })
        );
      }
      function unsubscribe() { while (unsubs.length) { try { unsubs.pop()(); } catch (_) { /* ignore */ } } }

      renderList();
      return {
        show() {
          subscribe();
          if (!running && !fixRunning) return run();
          // scan/fix still in flight from an earlier visit: just redraw
          renderList();
        },
        hide() { unsubscribe(); }
      };
    }
  });
})();

</script>
<script>
/* pages/network.js - Network tool page (port of NetworkToolsView + Ping/DnsLookup/Traceroute/IpConfiguration/NetworkMaintenance view models).
 * Tabs (same order as NetworkToolsViewModel): Ping, DNS Lookup, Traceroute, IP Configuration, Maintenance.
 * Deep link: WK.nav.go('network', { tab: 'ping' | 'dns' | 'traceroute' | 'ipconfig' | 'maintenance' }).  Opening the page without a tab selects Ping
 * (the C# calls SelectFirstTab on every navigation). Running pings/traces are NOT cancelled when the page is left (the C# view models live on). */
(function () {
  'use strict';
  const WK = window.WK, el = WK.ui.el;

  // ---- styles (prefix .net-) ----
  const css = `
.net-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.net-bar input[type=text]{width:260px;padding:7px 10px}
.net-bar button{padding:7px 16px}
.net-rows{padding:0}
.net-row{display:grid;align-items:baseline;column-gap:0;padding:10px 16px;border-bottom:1px solid transparent}
.net-ping{grid-template-columns:60px 160px 1fr}
.net-trace{grid-template-columns:40px 160px 1fr 80px}
.net-headrow{padding:9px 16px;border-bottom:1px solid var(--wk-border);color:var(--wk-text-muted);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.net-row+.net-row{border-top:1px solid rgba(var(--wk-border-rgb),.6)}
.net-row:hover{background:rgba(var(--wk-text-primary-rgb),.03)}
.net-lat{font-variant-numeric:tabular-nums}
.net-row>*{min-width:0}
.net-trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:12px}
.net-scroll{max-height:520px;overflow:auto}
.net-hint{padding:18px 16px}
.net-stat{margin-top:8px}
.net-dns-addr{font-family:var(--wk-mono);margin-bottom:4px}
.net-err{color:var(--wk-error)}
.net-adapters{display:flex;flex-direction:column;gap:12px}
.net-adapter .net-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.net-adapter .net-pill{border-radius:99px;padding:2px 10px;background:rgba(var(--wk-text-primary-rgb),.08);color:var(--wk-text-muted);font-size:var(--wk-font-size-small);font-weight:600;white-space:nowrap}
.net-adapter .net-pill.up{background:rgba(var(--wk-success-rgb),.15);color:var(--wk-success)}
.net-adapter .net-kv{display:grid;grid-template-columns:150px 1fr;row-gap:6px;margin-top:10px}
.net-adapter .net-kv dt{color:var(--wk-text-muted);font-size:var(--wk-font-size-small);margin:0;line-height:1.7}
.net-adapter .net-kv dd{margin:0;word-break:break-word}
.net-maint{display:flex;flex-wrap:wrap;gap:14px}
.net-mcard{width:230px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.net-mcard .net-act{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.net-mcard .net-act button{padding:7px 14px;margin-left:auto}
.net-top-right{display:flex;justify-content:flex-end;margin-bottom:12px}
.net-top-right button{padding:7px 14px}
`;
  document.head.appendChild(el('style', { 'data-for': 'net', text: css }));

  let opSeq = 0;
  const newOp = (p) => p + '-' + Date.now().toString(36) + '-' + (++opSeq);
  const errText = (e) => (e && e.message) ? e.message : String(e);

  const tone = (ms) => ms == null ? '' : ms < 60 ? 'wk-tone-ok' : ms < 150 ? 'wk-tone-warn' : 'wk-tone-bad';      // green / amber / red latency

  // ---- shared: host bar (textbox + Run/Stop) ----
  function hostBar(def, runLabel, onRun, onStop) {
    const input = el('input', { type: 'text', value: def, spellcheck: 'false', 'aria-label': 'Host',
      onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); onRun(); } } });
    const run = el('button', { class: 'primary', text: runLabel, onclick: onRun });
    const stop = el('button', { text: 'Stop', class: 'wk-hide', onclick: onStop });
    const bar = el('div', { class: 'net-bar' }, input, run, onStop ? stop : null);
    return { bar, input, setRunning(r) { run.classList.toggle('wk-hide', !!r && !!onStop); stop.classList.toggle('wk-hide', !r); run.disabled = !!r; } };
  }

  // ---------------------------------------------------------------- Ping
  function pingTab(panel) {
    let running = false, opId = null, seen = new Set();
    const bar = hostBar('8.8.8.8', 'Ping', run, stop);
    const rows = el('div', { class: 'net-rows' });
    const hint = el('div', { class: 'net-hint wk-muted', text: 'Enter a host name or IP address and press Ping.' });
    const card = el('div', { class: 'wk-card', style: 'padding:0;overflow:hidden' }, hint, rows);
    const stat = el('div', { class: 'net-stat wk-muted' });
    panel.append(bar.bar, card, stat);

    function addRow(r) {
      if (!r || seen.has(r.sequence)) return; seen.add(r.sequence);
      hint.classList.add('wk-hide');
      const ok = r.status === 'Success';
      const result = ok ? 'Reply in ' + (r.rttMs == null ? '?' : r.rttMs) + ' ms'
        : r.status === 'TimedOut' ? 'Request timed out'
        : r.status === 'Unknown' ? 'No reply (host not found or unreachable)'
        : String(r.status || '').replace(/([a-z])([A-Z])/g, '$1 $2');
      rows.append(el('div', { class: 'net-row net-ping' },
        el('span', { class: 'wk-muted', text: '#' + r.sequence }),
        el('span', { class: 'selectable', text: r.address == null ? '' : r.address }),
        el('span', { class: 'net-lat ' + (ok ? tone(r.rttMs) : 'wk-tone-warn'), text: result })));
    }
    async function run() {
      const host = bar.input.value.trim();
      if (!host || running) return;
      rows.replaceChildren(); seen = new Set(); stat.textContent = ''; hint.classList.add('wk-hide');
      running = true; bar.setRunning(true); opId = newOp('ping');
      const my = opId, off = WK.on('ping_reply', (d) => { if (d && d.opId === my) addRow(d.reply); });
      try {
        const res = await WK.native('ping_run', { host, count: 4, opId: my });
        (res && res.replies || []).forEach(addRow);
        if (res && res.received === 0 && !res.cancelled && !seen.size) hint.classList.remove('wk-hide');
        if (res && res.sent) stat.textContent = 'Sent ' + res.sent + ', received ' + res.received + ', lost ' + res.lost +
          (res.received ? ' - min ' + res.minMs + 'ms, avg ' + res.avgMs + 'ms, max ' + res.maxMs + 'ms' : '') + (res.cancelled ? ' (stopped)' : '');
      } catch (e) {
        WK.alert('Ping failed', errText(e));
      } finally {
        off(); running = false; opId = null; bar.setRunning(false);
        if (!seen.size) hint.classList.remove('wk-hide');
      }
    }
    function stop() { if (opId) WK.native('ping_cancel', { opId }).catch(() => {}); }
    return {};
  }

  // ---------------------------------------------------------------- DNS
  function dnsTab(panel) {
    let running = false;
    const bar = hostBar('example.com', 'Lookup', run, null);
    const body = el('div');
    const card = el('div', { class: 'wk-card wk-hide' }, body);
    const hint = el('div', { class: 'wk-card wk-muted', text: 'Enter a host name or IP address and press Lookup.' });
    panel.append(bar.bar, hint, card);
    async function run() {
      const host = bar.input.value.trim();
      if (!host || running) return;
      running = true; bar.setRunning(true); card.classList.add('wk-hide'); hint.classList.add('wk-hide');
      body.replaceChildren(el('span', { class: 'wk-spin' }), ' ', el('span', { class: 'wk-secondary', text: 'Looking up ' + host + '...' }));
      card.classList.remove('wk-hide');
      try {
        const out = await WK.native('dns_lookup', { host });
        if (out && out.success && out.value) {
          body.replaceChildren(el('div', { class: 'wk-title', style: 'margin-bottom:10px', text: out.value.hostName == null ? '' : out.value.hostName }),
            ...(out.value.addresses || []).map(a => el('div', { class: 'net-dns-addr selectable', text: a })));
        } else {
          body.replaceChildren(el('div', { class: 'net-err', text: (out && out.userMessage) || '' }));
        }
      } catch (e) {
        body.replaceChildren(el('div', { class: 'net-err', text: errText(e) }));
      } finally { running = false; bar.setRunning(false); }
    }
    return {};
  }

  // ---------------------------------------------------------------- Traceroute
  function traceTab(panel) {
    let running = false, opId = null, seen = new Set();
    const bar = hostBar('8.8.8.8', 'Trace', run, stop);
    const rows = el('div', { class: 'net-rows' });
    const scroll = el('div', { class: 'net-scroll' }, rows);
    const hint = el('div', { class: 'net-hint wk-muted', text: 'Enter a host name or IP address and press Trace.' });
    const head = el('div', { class: 'net-row net-trace net-headrow wk-hide' }, el('span', { text: 'Hop' }), el('span', { text: 'Address' }), el('span', { text: 'Host name' }), el('span', { text: 'Time' }));
    const card = el('div', { class: 'wk-card', style: 'padding:0;overflow:hidden' }, hint, head, scroll);
    const stat = el('div', { class: 'net-stat wk-muted' });
    panel.append(bar.bar, card, stat);

    function addHop(h, host) {
      if (!h) return; const key = h.hop + '|' + (h.address || '') + '|' + h.timedOut;
      if (seen.has(key)) return; seen.add(key);
      hint.classList.add('wk-hide'); head.classList.remove('wk-hide');
      let name = h.hostName == null ? '' : h.hostName;
      if (h.timedOut) name = h.hop === 0 ? 'Could not resolve "' + host + '".' : 'Request timed out';
      rows.append(el('div', { class: 'net-row net-trace' },
        el('span', { class: 'wk-muted', text: h.hop }),
        el('span', { text: h.address == null ? '' : h.address }),
        el('span', { class: 'wk-secondary net-trunc', title: name, text: name }),
        el('span', { class: 'net-lat ' + tone(h.rttMs), text: h.rttMs == null ? '' : h.rttMs + ' ms' })));
      scroll.scrollTop = scroll.scrollHeight;
    }
    async function run() {
      const host = bar.input.value.trim();
      if (!host || running) return;
      rows.replaceChildren(); seen = new Set(); stat.textContent = ''; head.classList.add('wk-hide');
      running = true; bar.setRunning(true); opId = newOp('trace');
      const my = opId, off = WK.on('trace_hop', (d) => { if (d && d.opId === my) addHop(d.hop, host); });
      try {
        const res = await WK.native('trace_run', { host, maxHops: 30, opId: my });
        (res && res.hops || []).forEach(h => addHop(h, host));
        if (res && res.resolved && res.destination) stat.textContent = (res.reached ? 'Trace complete' : (res.cancelled ? 'Stopped' : 'Destination not reached')) + ' - ' + res.destination;
      } catch (e) {
        WK.alert('Traceroute failed', errText(e));
      } finally {
        off(); running = false; opId = null; bar.setRunning(false);
        if (!seen.size) hint.classList.remove('wk-hide');
      }
    }
    function stop() { if (opId) WK.native('trace_cancel', { opId }).catch(() => {}); }
    return {};
  }

  // ---------------------------------------------------------------- IP configuration
  function ipTab(panel) {
    let loading = false, loaded = false;
    const btn = el('button', { text: 'Refresh', onclick: refresh });
    const list = el('div', { class: 'net-adapters' });
    const state = el('div', { class: 'wk-muted', style: 'margin-bottom:12px' });
    panel.append(el('div', { class: 'net-top-right' }, state, btn), list);
    state.style.marginRight = 'auto'; state.parentNode.style.alignItems = 'center';
    const first = (a) => (a && a.length ? String(a[0]) : '-');
    function card(a) {
      return el('div', { class: 'wk-card net-adapter' },
        el('div', { class: 'net-head' }, el('div', { class: 'wk-title', text: a.name || '' }), el('span', { class: 'net-pill' + (a.isUp ? ' up' : ''), text: a.isUp ? 'Connected' : 'Not connected' })),
        el('div', { class: 'wk-muted', style: 'margin-top:2px', text: a.description || '' }),
        el('dl', { class: 'net-kv' },
          el('dt', { text: 'IPv4' }), el('dd', { class: 'selectable', text: first(a.ipv4Addresses) }),
          el('dt', { text: 'MAC address' }), el('dd', { class: 'selectable', text: a.macAddress == null ? '' : a.macAddress }),
          el('dt', { text: 'IPv6' }), el('dd', { class: 'selectable', text: first(a.ipv6Addresses) }),
          el('dt', { text: 'Gateway' }), el('dd', { class: 'selectable', text: first(a.gateways) }),
          el('dt', { text: 'DNS servers' }), el('dd', { class: 'selectable', text: a.dnsServers && a.dnsServers.length ? a.dnsServers.join(', ') : '-' }),
          el('dt', { text: 'DHCP' }), el('dd', { text: a.dhcpEnabled ? 'Enabled' : 'Disabled' })));
    }
    async function refresh() {
      if (loading) return;
      loading = true; btn.disabled = true; loaded = true;
      state.replaceChildren(el('span', { class: 'wk-spin' }), ' Loading adapters...');
      try {
        const adapters = await WK.native('ipcfg_get');
        list.replaceChildren(...(adapters || []).map(card));
        if (!adapters || !adapters.length) list.append(el('div', { class: 'wk-card wk-muted', text: 'No network adapters found.' }));
      } catch (e) {
        WK.alert('Could not read IP configuration', errText(e));
      } finally { loading = false; btn.disabled = false; state.replaceChildren(); }
    }
    return { show() { if (!loaded) refresh(); } };   // C#: loaded once, on first selection of the tab
  }

  // ---------------------------------------------------------------- Maintenance
  function maintTab(panel) {
    let busy = false; const buttons = [];
    const ACTIONS = [
      { cmd: 'netmaint_flushdns', card: 'Flush DNS', desc: 'Clear the local DNS resolver cache.', title: 'Flush DNS', msg: "This clears your computer's cached DNS lookups.", ok: 'Flush DNS', destructive: false, success: 'DNS cache flushed', admin: false },
      { cmd: 'netmaint_dhcprenew', card: 'DHCP Renew', desc: 'Request a new IP address lease.', title: 'Renew DHCP lease', msg: "This requests a new IP address from your network's DHCP server.", ok: 'Renew', destructive: false, success: 'DHCP lease renewed', admin: true },
      { cmd: 'netmaint_dhcprelease', card: 'DHCP Release', desc: 'Release your current IP address lease.', title: 'Release DHCP lease', msg: "This releases your current IP address. You'll briefly lose network connectivity.", ok: 'Release', destructive: true, success: 'DHCP lease released', admin: true },
      { cmd: 'netmaint_winsockreset', card: 'Winsock Reset', desc: 'Reset the Windows network stack.', title: 'Reset Winsock', msg: 'This resets the Windows network stack. Your computer may need to be restarted.', ok: 'Reset Winsock', destructive: true, success: 'Winsock reset', admin: true },
      { cmd: 'netmaint_tcpipreset', card: 'TCP/IP Reset', desc: 'Reset TCP/IP to its default configuration.', title: 'Reset TCP/IP', msg: 'This resets the TCP/IP stack to its default configuration. Your computer may need to be restarted.', ok: 'Reset TCP/IP', destructive: true, success: 'TCP/IP stack reset', admin: true },
    ];
    async function act(a) {
      const ok = await WK.confirm({ title: a.title, message: a.msg, confirmText: a.ok, isDestructive: a.destructive });
      if (!ok || busy) return;
      busy = true; buttons.forEach(b => b.disabled = true);
      try {
        const r = await WK.native(a.cmd);
        if (r && r.success) {
          WK.activity.record(a.success, 'Success');
          WK.toast(a.success, undefined, 'Success');
        } else {
          WK.alert(a.title + ' failed', (r && r.userMessage) || 'Unknown error.', r && r.technicalDetail);
        }
      } catch (e) {
        WK.alert(a.title + ' failed', errText(e));
      } finally { busy = false; buttons.forEach(b => b.disabled = false); }
    }
    const wrap = el('div', { class: 'net-maint' });
    ACTIONS.forEach(a => {
      const b = el('button', { class: a.destructive ? 'destructive' : '', text: 'Run', onclick: () => act(a) });
      buttons.push(b);
      wrap.append(el('div', { class: 'wk-card net-mcard' },
        el('div', null, el('div', { class: 'wk-title', text: a.card }), el('div', { class: 'wk-secondary', style: 'margin-top:4px', text: a.desc }),
          a.admin ? el('div', { class: 'wk-muted', style: 'margin-top:6px', text: 'Asks for administrator approval' }) : null),
        el('div', { class: 'net-act' }, b)));
    });
    panel.append(wrap);
    return {};
  }

  // ---------------------------------------------------------------- page
  const TAB_ALIAS = { ping: 'ping', dns: 'dns', dnslookup: 'dns', 'dns-lookup': 'dns', traceroute: 'traceroute', trace: 'traceroute', tracert: 'traceroute',
    ipconfig: 'ipconfig', ip: 'ipconfig', ipconfiguration: 'ipconfig', 'ip-configuration': 'ipconfig', maintenance: 'maintenance', maint: 'maintenance', netmaint: 'maintenance' };

  WK.pages.register('network', {
    title: 'Network',
    create(root) {
      const tp = WK.ui.tabsPage(root, 'Network', [
        { id: 'ping', title: 'Ping', create: pingTab },
        { id: 'dns', title: 'DNS Lookup', create: dnsTab },
        { id: 'traceroute', title: 'Traceroute', create: traceTab },
        { id: 'ipconfig', title: 'IP Configuration', create: ipTab },
        { id: 'maintenance', title: 'Maintenance', create: maintTab },
      ], 'Test connectivity, look up names, inspect adapters and reset the network stack.');
      return {
        show(opts) {
          const want = opts && opts.tab ? TAB_ALIAS[String(opts.tab).toLowerCase()] : null;
          tp.select(want || 'ping');
        },
        hide() { tp.hide(); },
      };
    },
  });

<script>
/* pages/system.js - System tool (port of SystemToolsView + SystemTools/*View + view models).

 * Semantics copied from the C#: SystemToolsViewModel is transient, so every visit of the page starts on the first tab
 * (or the deep-linked one), every tab (re)loads the first time it is selected in a visit, the 1 s process refresh timer

  }

  const scroller = (table, extra) => el('div', { class: 'sys-scroll ' + (extra || '') }, table.el || table);
  const refreshBtn = (fn) => { const b = el('button', { text: 'Refresh' }); b.addEventListener('click', () => WK.ui.busy(b, fn)); return b; };
  const bar = (left, right) => el('div', { class: 'sys-bar' }, el('div', { class: 'sys-grow wk-secondary' }, left), right);

  const factories = {};
  WK._systemTabs = factories;

  // =====================================================================================================
  // Process Manager
  // =====================================================================================================
  factories.processes = function () {
    let list = [], timer = null, refreshing = false, frozen = false, visible = false, tabOn = false, locked = false;
    const count = el('span', { text: '0 processes' });
    const freezeBtn = el('button', { text: 'Freeze', onclick: toggleFreeze });
    const wrap = el('div');
    const tbl = makeTable([
      { key: 'name', title: 'Name', width: 220, text: r => r.name, cmp: strCmp },
      { key: 'id', title: 'PID', width: 70, text: r => r.id, cmp: numCmp },
      { key: 'cpuPercent', title: 'CPU', width: 70, text: r => Number(r.cpuPercent).toFixed(1) + '%', val: r => r.cpuPercent, cmp: numCmp },
      { key: 'workingSetBytes', title: 'Memory', width: 100, text: r => WK.fmt.bytes(r.workingSetBytes), val: r => r.workingSetBytes, cmp: numCmp },
      { key: 'filePath', title: 'Path', text: r => r.filePath || '', cmp: strCmp },
      { key: 'end', title: '', width: 90, sortable: false, sig: r => 'e' + !!r.canBeEnded + '|' + r.name,
        node: (r, get) => el('button', { class: 'sm destructive', 'data-act': 1, text: 'End', disabled: !r.canBeEnded, onclick: () => endProcess(get()) }) },
    ], r => r.id, { empty: 'Loading…' });
    wrap.append(card(scroller(tbl)));
    const root = el('div', null, bar(count, freezeBtn), wrap);

    async function refresh() {
      if (refreshing) return; refreshing = true;
      try {
        list = await WK.native('proc_list');
        if (!Array.isArray(list)) list = [];
        tbl.setEmpty('No processes.'); tbl.set(list); count.textContent = list.length + ' processes';
      } catch (e) { console.error('proc_list failed', e); }
      finally { refreshing = false; }
    }
    function updateTimer() {
      if (timer) { clearInterval(timer); timer = null; }
      if (visible && tabOn && !frozen) timer = setInterval(refresh, 1000);      // only poll while this tab is actually on screen
    }
    async function toggleFreeze() {
      frozen = !frozen; freezeBtn.textContent = frozen ? 'Unfreeze' : 'Freeze';
      updateTimer(); if (!frozen) await refresh();
    }
    async function endProcess(p) {
      if (locked) return;
      const ok = await WK.confirm({ title: 'End process', message: 'End "' + p.name + '" (PID ' + p.id + ')? Unsaved work in this process will be lost.', confirmText: 'End process', isDestructive: true });
      if (!ok) return;
      locked = true; wrap.classList.add('sys-lock');
      try {
        let r; try { r = await WK.native('proc_end', { pid: p.id }); } catch (e) { r = { success: false, message: errMsg(e) }; }
        await opOk(r, "Couldn't end process");
        if (!frozen) await refresh();
      } finally { locked = false; wrap.classList.remove('sys-lock'); }
    }
    return {
      el: root, load: refresh,
      pageShow() { visible = true; frozen = false; freezeBtn.textContent = 'Freeze'; updateTimer(); },   // new VM per visit
      pageHide() { visible = false; updateTimer(); },
      tabShow() { tabOn = true; updateTimer(); },
      tabHide() { tabOn = false; updateTimer(); },
    };
  };

  // =====================================================================================================
  // Startup Manager
  // =====================================================================================================
  factories.startup = function () {
    const list = el('div'); const holder = card(el('div', { class: 'sys-scroll' }, list));
    let busy = false;
    const root = el('div', null, bar('Apps that launch automatically when you sign in', refreshBtn(load)), holder);
    list.append(el('div', { class: 'wk-empty', text: 'Loading…' }));
    async function load() {
      let r; try { r = await WK.native('startup_list'); } catch (e) { await WK.alert("Couldn't load startup items", errMsg(e)); return; }
      r = Array.isArray(r) ? r : [];
      list.replaceChildren(...(r.length ? r.map(row) : [el('div', { class: 'wk-empty', text: 'No startup items.' })]));
    }
    function row(e) {
      const sw = el('input', { type: 'checkbox', class: 'wk-switch', checked: e.isEnabled, 'aria-label': (e.isEnabled ? 'Disable ' : 'Enable ') + e.name });
      sw.addEventListener('change', async () => {
        if (busy) { sw.checked = e.isEnabled; return; }
        busy = true; sw.disabled = true;
        try {
          let res; try { res = await WK.native('startup_set', { scope: e.scope, name: e.name, command: e.command, enabled: !e.isEnabled }); } catch (x) { res = { success: false, message: errMsg(x) }; }
          await opOk(res, "Couldn't change startup item");
        } finally { busy = false; }
        await load();
      });
      return el('div', { class: 'sys-row' },
        el('div', { class: 'sys-main' }, el('div', { text: e.name }), el('div', { class: 'wk-muted', text: e.command, title: e.command })),
        e.requiresElevationToChange ? el('span', { class: 'wk-badge muted', title: 'Changing this item needs administrator rights', text: 'Admin' }) : null, sw);
    }
    return { el: root, load };
  };

  // =====================================================================================================
  // Services
  // =====================================================================================================
  const STATUS_ORDER = ['Stopped', 'StartPending', 'StopPending', 'Running', 'ContinuePending', 'PausePending', 'Paused'];
  const STARTUP_ORDER = ['Boot', 'System', 'Automatic', 'Manual', 'Disabled', 'Unknown'];
  factories.services = function () {
    let list = [], locked = false; const count = el('span', { text: '0 services' }), wrap = el('div');
    const tbl = makeTable([
      { key: 'displayName', title: 'Name', width: 320, text: r => r.displayName, cmp: strCmp },
      { key: 'status', title: 'Status', width: 100, text: r => r.status, tcls: r => r.status === 'Running' ? 'sys-st-run' : r.status === 'Stopped' ? 'sys-st-stop' : '', val: r => STATUS_ORDER.indexOf(r.status), cmp: numCmp },
      { key: 'startupType', title: 'Startup type', width: 110, text: r => r.startupType, val: r => STARTUP_ORDER.indexOf(r.startupType), cmp: numCmp },
      { key: 'act', title: '', width: 160, sortable: false, sig: r => 'a' + !!r.canStart + !!r.canStop + r.displayName,
        node: (r, get) => el('span', null,
          el('button', { class: 'sm', 'data-act': 1, text: 'Start', disabled: !r.canStart, onclick: () => start(get()) }),
          el('button', { class: 'sm destructive', 'data-act': 1, text: 'Stop', disabled: !r.canStop, onclick: () => stop(get()) })) },
    ], r => r.name, { empty: 'Loading…' });
    wrap.append(card(scroller(tbl)));
    async function load() {
      let r; try { r = await WK.native('svc_list'); } catch (e) { await WK.alert("Couldn't load services", errMsg(e)); return; }
      list = Array.isArray(r) ? r : []; tbl.setEmpty('No services.'); tbl.set(list); count.textContent = list.length + ' services';
    }
    async function run(fn) { if (locked) return; locked = true; wrap.classList.add('sys-lock'); try { await fn(); await load(); } finally { locked = false; wrap.classList.remove('sys-lock'); } }
    const start = s => run(async () => {
      let r; try { r = await WK.native('svc_start', { name: s.name }); } catch (e) { r = { success: false, message: errMsg(e) }; }
      await opOk(r, "Couldn't start service");
    });
    const stop = async s => {
      if (locked) return;
      const ok = await WK.confirm({ title: 'Stop service', message: 'Stop "' + s.displayName + '"? Some features of Windows or other apps may stop working until it\'s started again.', confirmText: 'Stop service', isDestructive: true });
      if (!ok) return;
      await run(async () => {
        let r; try { r = await WK.native('svc_stop', { name: s.name }); } catch (e) { r = { success: false, message: errMsg(e) }; }
        await opOk(r, "Couldn't stop service");
      });
    };
    return { el: el('div', null, bar(count, refreshBtn(load)), wrap), load };
  };

  // =====================================================================================================
  // Installed applications
  // =====================================================================================================
  factories.apps = function () {
    let list = [], locked = false; const uninstalling = new Set(); const count = el('span', { text: '0 applications' }), wrap = el('div');
    const tbl = makeTable([
      { key: 'name', title: 'Name', width: 270, text: r => r.name, cmp: strCmp },
      { key: 'publisher', title: 'Publisher', width: 170, text: r => r.publisher || '', cmp: strCmp },
      { key: 'version', title: 'Version', width: 90, text: r => r.version || '', cmp: strCmp },
      { key: 'estimatedSizeMb', title: 'Size', width: 80, text: r => WK.fmt.megabytes(r.estimatedSizeMb), val: r => r.estimatedSizeMb, cmp: numCmp },
      { key: 'act', title: '', width: 156, sortable: false, sig: r => 'u' + uninstalling.has(r.name) + r.name,
        node: (r, get) => { const b = uninstalling.has(r.name);
          return el('span', null, el('button', { class: 'sm destructive', 'data-act': 1, text: 'Uninstall', disabled: b, onclick: () => uninstall(get()) }), b ? el('span', { class: 'sys-pulse' }) : null); } },
    ], r => r.name, { empty: 'Loading…' });
    wrap.append(card(scroller(tbl)));
    async function load() {
      let r; try { r = await WK.native('apps_list'); } catch (e) { await WK.alert("Couldn't load installed applications", errMsg(e)); return; }
      list = Array.isArray(r) ? r : []; tbl.setEmpty('No applications found.'); tbl.set(list); count.textContent = list.length + ' applications';
    }
    async function uninstall(a) {
      if (locked || uninstalling.has(a.name)) return;
      const ok = await WK.confirm({ title: 'Uninstall application', message: 'This opens the uninstaller for "' + a.name + '". WinKit doesn\'t remove anything itself \u2014 you\'ll finish the uninstall in the app\'s own wizard.', confirmText: 'Continue', isDestructive: true });
      if (!ok) return;
      uninstalling.add(a.name); tbl.repaint();
      try {
        let r; try { r = await WK.native('apps_uninstall', { name: a.name }); } catch (e) { r = { success: false, message: errMsg(e) }; }
        if (!(await opOk(r, "Couldn't start uninstaller"))) return;
        await new Promise(res => setTimeout(res, 2000));   // C# holds the busy pulse for 2 s after a successful launch
      } finally { uninstalling.delete(a.name); tbl.repaint(); }
    }
    return { el: el('div', null, bar(count, refreshBtn(load)), wrap), load };
  };

  // =====================================================================================================
  // Environment variables
  // =====================================================================================================
  factories.env = function () {
    let list = [], locked = false; const wrap = el('div');
    const name = el('input', { type: 'text', placeholder: 'Name', title: 'Variable name', style: 'width:180px', 'aria-label': 'Variable name' });
    const value = el('input', { type: 'text', placeholder: 'Value', title: 'Value', style: 'width:260px', 'aria-label': 'Value' });
    const scope = el('select', { 'aria-label': 'Scope' }, el('option', { value: 'User', text: 'User' }), el('option', { value: 'Machine', text: 'Machine' }));
    const add = el('button', { class: 'primary', text: 'Add', onclick: addVar });
    const form = el('div', { class: 'wk-card sys-env-form', style: 'margin-bottom:12px' }, name, value, scope, add);
    const tbl = makeTable([
      { key: 'scope', title: 'Scope', width: 80, text: r => r.scope, val: r => r.scope === 'User' ? 0 : 1, cmp: numCmp },
      { key: 'name', title: 'Name', width: 220, text: r => r.name, cmp: strCmp },
      { key: 'value', title: 'Value', text: r => r.value, cmp: strCmp },
      { key: 'act', title: '', width: 96, sortable: false, sig: r => 'd' + r.name,
        node: (r, get) => el('button', { class: 'sm destructive', 'data-act': 1, text: 'Delete', onclick: () => del(get()) }) },
    ], r => r.scope + '\u0000' + r.name, { empty: 'Loading…' });
    wrap.append(card(scroller(tbl, 'sys-env')));
    async function load() {
      let r; try { r = await WK.native('env_list'); } catch (e) { await WK.alert("Couldn't load environment variables", errMsg(e)); return; }
      list = Array.isArray(r) ? r : []; tbl.setEmpty('No environment variables.'); tbl.set(list);
    }
    async function addVar() {
      const nm = name.value.trim();
      if (!nm) return;                                     // C#: silently ignores a blank name
      if (!value.value) { name.focus(); await WK.alert('Enter a value', 'Windows does not keep environment variables with an empty value. Type a value for "' + nm + '", or use Delete on the list to remove a variable.'); return; }
      if (locked) return; locked = true; wrap.classList.add('sys-lock');
      try {
        let r; try { r = await WK.native('env_set', { scope: scope.value, name: nm, value: value.value }); } catch (e) { r = { success: false, message: errMsg(e) }; }
        if (!(await opOk(r, "Couldn't set variable"))) return;
        name.value = ''; value.value = ''; await load();
      } finally { locked = false; wrap.classList.remove('sys-lock'); }
    }
    async function del(v) {
      if (locked) return;
      const ok = await WK.confirm({ title: 'Delete environment variable', message: 'Delete "' + v.name + '"? Applications that rely on it may stop working correctly.', confirmText: 'Delete', isDestructive: true });
      if (!ok) return;
      locked = true; wrap.classList.add('sys-lock');
      try {
        let r; try { r = await WK.native('env_delete', { scope: v.scope, name: v.name }); } catch (e) { r = { success: false, message: errMsg(e) }; }
        await opOk(r, "Couldn't delete variable"); await load();
      } finally { locked = false; wrap.classList.remove('sys-lock'); }
    }
    return { el: el('div', null, form, wrap), load };
  };

  // =====================================================================================================
  // Hosts file
  // =====================================================================================================
  factories.hosts = function () {
    const path = el('div', { class: 'wk-secondary selectable', text: 'C:\\Windows\\System32\\drivers\\etc\\hosts' });
    const ta = el('textarea', { class: 'sys-hosts', spellcheck: 'false', wrap: 'off', 'aria-label': 'Hosts file contents' });
    ta.addEventListener('keydown', e => {   // AcceptsTab="True"
      if (e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.shiftKey) { e.preventDefault(); document.execCommand('insertText', false, '\t'); }
    });
    const reload = el('button', { text: 'Reload', style: 'padding:7px 14px;margin-right:8px' });
    reload.addEventListener('click', () => WK.ui.busy(reload, load));
    const save = el('button', { class: 'primary', text: 'Save', style: 'padding:7px 14px' });
    save.addEventListener('click', () => WK.ui.busy(save, doSave));
    const root = el('div', null,
      el('div', { class: 'sys-bar' },
        el('div', { class: 'sys-grow' }, path, el('div', { class: 'wk-muted', text: 'Editing requires administrator access. Changes take effect immediately.' })),
        el('div', null, reload, save)),
      card(ta));
    async function load() {
      let r; try { r = await WK.native('hosts_get'); } catch (e) { await WK.alert("Couldn't load hosts file", errMsg(e)); return; }
      if (r && r.path) path.textContent = r.path;
      ta.value = (r && r.content) || '';
    }
    async function doSave() {
      const ok = await WK.confirm({ title: 'Save hosts file', message: "This changes how your computer resolves domain names to IP addresses system-wide. Only continue if you're sure about these changes.", confirmText: 'Save', isDestructive: true });
      if (!ok) return;
      const content = ta.value.replace(/\r?\n/g, '\r\n');   // WPF TextBox yields CRLF
      let r; try { r = await WK.native('hosts_save', { content }); } catch (e) { r = { success: false, message: errMsg(e) }; }
      if (!(await opOk(r, "Couldn't save hosts file"))) return;
      WK.toast('Hosts file saved', null, 'Success');
    }
    return { el: root, load };
  };

  // =====================================================================================================
  // System information
  // =====================================================================================================
  factories.info = function () {
    const rows = [['Machine name', 'machine'], ['Architecture', 'arch'], ['Windows version', 'win'], ['Processor', 'cpu'], ['Logical cores', 'cores'],
      ['Memory', 'mem'], ['GPU', 'gpu'], ['Network adapter', 'nic'], ['IP address', 'ip'], ['System uptime', 'up']];
    const vals = {};
    const box = el('div', { class: 'wk-card sys-info' }, rows.map(([l, k]) => el('div', { class: 'sys-ir' }, el('div', { class: 'sys-il', text: l }), vals[k] = el('div', { class: 'sys-iv selectable' }))));
    let timer = null, baseMs = null, baseAt = 0, visible = false;
    function tick() { if (baseMs != null) vals.up.textContent = WK.fmt.uptimeMs(baseMs + (performance.now() - baseAt)); }
    function setUptime(ms) { baseMs = Number(ms) || 0; baseAt = performance.now(); tick(); }
    function updateTimer() { if (timer) { clearInterval(timer); timer = null; } if (visible) timer = setInterval(tick, 1000); }
    async function load() {
      let r; try { r = await WK.native('sysinfo_get'); } catch (e) { await WK.alert("Couldn't load system information", errMsg(e)); return; }
      if (!r) return;
      const s = (k, v) => { vals[k].textContent = v == null ? '' : String(v); };
      s('machine', r.machineName); s('arch', r.architecture); s('win', r.windowsVersion);
      s('cpu', r.cpu && r.cpu.name); s('cores', r.cpu && r.cpu.coreCount);
      s('mem', r.memory && trim0(r.memory.totalGb) + ' GB'); s('gpu', r.gpu && r.gpu.name);
      s('nic', r.network && r.network.adapterName); s('ip', r.network && r.network.ipAddress);
      setUptime(r.uptimeMs);
    }
    const refresh = el('button', { text: 'Refresh', style: 'padding:7px 14px' }); refresh.addEventListener('click', () => WK.ui.busy(refresh, load));
    return {
      el: el('div', null, el('div', { style: 'display:flex;justify-content:flex-end;margin-bottom:12px' }, refresh), box), load,
      async pageShow() { visible = true; updateTimer(); try { const u = await WK.native('sysinfo_uptime'); if (u) setUptime(u.uptimeMs); } catch (_) { /* ticker starts after sysinfo_get */ } },
      pageHide() { visible = false; updateTimer(); },
    };
  };

  // =====================================================================================================
  // Page
  // =====================================================================================================
  const TABS = [
    { id: 'processes', title: 'Processes' },
    { id: 'startup', title: 'Startup' },
    { id: 'services', title: 'Services' },
    { id: 'apps', title: 'Applications' },
    { id: 'env', title: 'Environment' },
    { id: 'hosts', title: 'Hosts file' },
    { id: 'info', title: 'System info' },
  ];
  const ALIAS = { process: 'processes', proc: 'processes', 'process-manager': 'processes', startup_manager: 'startup', 'startup-manager': 'startup', service: 'services',
    installed: 'apps', applications: 'apps', 'installed-apps': 'apps', environment: 'env', environment_variables: 'env', envvars: 'env', variables: 'env',
    hostsfile: 'hosts', 'hosts-file': 'hosts', sysinfo: 'info', information: 'info', 'system-information': 'info', system_information: 'info' };

  WK.pages.register('system', {
    title: 'System',
    create(root) {
      const ctl = {}, loaded = new Set(); let tabs = null, visible = false;
      // C# builds all view models up front; the process timer runs for the whole visit, so create that controller eagerly.
      ctl.processes = factories.processes();
      const defs = TABS.map(t => ({
        id: t.id, title: t.title,
        create(panel) {
          const c = ctl[t.id] || (ctl[t.id] = factories[t.id]());
          panel.append(c.el);
          if (visible && c.pageShow) c.pageShow();
          return {
            show() {
              c.tabShow && c.tabShow();
              if (!loaded.has(t.id)) { loaded.add(t.id); const p = c.load && c.load(); if (p && p.catch) p.catch(e => console.error(e)); }
            },
            hide() { c.tabHide && c.tabHide(); },
          };
        },
      }));
      tabs = WK.ui.tabsPage(root, 'System', defs, 'Processes, startup items, services, installed apps and system settings.');
      return {
        show(opts) {
          visible = true; loaded.clear();
          Object.values(ctl).forEach(c => c.pageShow && c.pageShow());
          let id = opts && opts.tab; id = ALIAS[id] || id;
          tabs.select(TABS.some(t => t.id === id) ? id : TABS[0].id);
        },
        hide() { visible = false; tabs.hide(); Object.values(ctl).forEach(c => c.pageHide && c.pageHide()); },
      };
    },
  });
})();

</script>
<script>WK.boot();</script>
</body>
</html>
