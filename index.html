<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinKit</title>
<style>
/* base.css - WinKit component styles. Everything is driven by the --wk-* variables WK.themes sets on :root.
   Fallbacks = Midnight so the first paint is already dark and matches the native window colour. */
:root{
  --wk-background:#161618;--wk-surface:#1D1D20;--wk-surface-elevated:#242427;--wk-border:#2B2B2F;
  --wk-text-primary:#DCDAD4;--wk-text-secondary:#A29F97;--wk-text-muted:#8C8981;
  --wk-accent:#8EA0B5;--wk-accent-hover:#A4B3C5;--wk-on-accent:#161618;
  --wk-success:#86B58F;--wk-warning:#D4A85F;--wk-error:#D9826F;--wk-update:#8EA0B5;
  --wk-accent-rgb:142,160,181;--wk-error-rgb:217,130,111;--wk-success-rgb:134,181,143;--wk-warning-rgb:212,168,95;
  --wk-text-primary-rgb:220,218,212;--wk-border-rgb:43,43,47;
  --wk-radius:10px;--wk-radius-sm:10px;--wk-sidebar-width:232px;
  --wk-shadow-md:0 10px 30px rgba(0,0,0,.42);
  --wk-font-size-small:11.5px;--wk-font-size-body:13px;--wk-font-size-title:15px;--wk-font-size-heading:21px;--wk-font-size-display:28px;
  --wk-anim-fast:120ms;--wk-anim-normal:160ms;
  --wk-font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --wk-mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wk-background);color:var(--wk-text-primary);font:var(--wk-font-size-body)/1.5 var(--wk-font);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
input,textarea,pre,code,.selectable{user-select:text;-webkit-user-select:text}
::selection{background:rgba(var(--wk-accent-rgb),.35)}
h1,h2,h3{letter-spacing:-.005em}

/* ---- typography ---- */
.wk-display{font-size:calc(var(--wk-font-size-display) - 3px);font-weight:600;letter-spacing:-.015em;line-height:1.2;margin:0}
.wk-heading{font-size:var(--wk-font-size-heading);font-weight:600;margin:0}
.wk-title{font-size:var(--wk-font-size-title);font-weight:600;margin:0}
.wk-secondary{color:var(--wk-text-secondary)}
.wk-muted{color:var(--wk-text-muted);font-size:var(--wk-font-size-small)}
.wk-mono{font-family:var(--wk-mono)}
.wk-ok{color:var(--wk-success)}.wk-warn{color:var(--wk-warning)}.wk-bad{color:var(--wk-error)}.wk-accent{color:var(--wk-accent)}
.wk-sub{margin:4px 0 0;color:var(--wk-text-secondary)}
.wk-pagehead{margin-bottom:2px}
.wk-eyebrow{margin:0 0 10px;color:var(--wk-text-muted);font-size:var(--wk-font-size-small);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ---- layout ---- */
#wk-root{display:flex;height:100%}
#wk-side{width:var(--wk-sidebar-width);flex:none;background:var(--wk-surface);border-right:1px solid var(--wk-border);display:flex;flex-direction:column;overflow:auto}
#wk-side .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-size:calc(var(--wk-font-size-title) + 1px);font-weight:600;letter-spacing:-.01em}
.wk-logo{width:28px;height:28px;border-radius:7px;background:var(--wk-accent);color:var(--wk-on-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.wk-logo svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wk-logo.lg{width:48px;height:48px;border-radius:12px}.wk-logo.lg svg{width:26px;height:26px}
#wk-nav{padding:2px 10px 10px;flex:1}
.wk-nav-item{display:flex;align-items:center;gap:11px;padding:8px 12px;margin-top:2px;border-radius:var(--wk-radius-sm);color:var(--wk-text-secondary);font-weight:500;cursor:pointer;position:relative;outline:none;transition:background var(--wk-anim-fast),color var(--wk-anim-fast)}
.wk-nav-item svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wk-nav-item:hover{background:rgba(var(--wk-text-primary-rgb),.06);color:var(--wk-text-primary)}
.wk-nav-item:focus-visible{box-shadow:0 0 0 2px var(--wk-accent)}
.wk-nav-item.on{background:rgba(var(--wk-accent-rgb),.13);color:var(--wk-text-primary);font-weight:600}
.wk-nav-item.on svg{color:var(--wk-accent)}
.wk-nav-item.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--wk-accent)}
.wk-nav-head{margin:20px 12px 6px;color:var(--wk-text-muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
#wk-nav .wk-nav-head:first-child{margin-top:8px}
.wk-side-foot{padding:12px 18px 16px;border-top:1px solid var(--wk-border);display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--wk-text-muted);font-size:var(--wk-font-size-small)}
#wk-main{flex:1;min-width:0;position:relative;overflow:hidden}
.wk-page{position:absolute;inset:0;overflow:auto;padding:28px 40px 36px;display:none}
.wk-page.on{display:block;animation:wk-page-in var(--wk-anim-normal) ease-out}
.wk-page.flush{padding:0}
@keyframes wk-page-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
body.onboarding #wk-side{display:none}

/* ---- cards ---- */
.wk-card{background:var(--wk-surface);border:1px solid var(--wk-border);border-radius:var(--wk-radius);padding:18px}      /* flat: hairline border, no shadow */
.wk-card.elevated{background:var(--wk-surface-elevated)}
.wk-card.interactive{cursor:pointer;transition:background var(--wk-anim-fast),border-color var(--wk-anim-fast)}
.wk-card.interactive:hover{background:var(--wk-surface-elevated);border-color:rgba(var(--wk-accent-rgb),.55)}
.wk-card.flat{padding:0;overflow:hidden}
.wk-stack{display:flex;flex-direction:column;gap:12px}
.wk-row{display:flex;align-items:center;gap:10px}
.wk-wrap{flex-wrap:wrap}
.wk-grow{flex:1;min-width:0}
.wk-gap-s{gap:6px}.wk-gap-l{gap:18px}
.wk-hide{display:none!important}

/* ---- buttons ---- */
button,.wk-btn{font:inherit;font-weight:500;padding:7px 16px;border-radius:var(--wk-radius-sm);border:1px solid var(--wk-border);background:var(--wk-surface-elevated);color:var(--wk-text-primary);cursor:pointer;position:relative;outline:none;transition:background var(--wk-anim-fast),border-color var(--wk-anim-fast),box-shadow var(--wk-anim-fast)}
button:hover:not(:disabled){background:rgba(var(--wk-text-primary-rgb),.07);border-color:rgba(var(--wk-text-primary-rgb),.22)}
button:active:not(:disabled){background:rgba(var(--wk-text-primary-rgb),.12)}
button:focus-visible{box-shadow:0 0 0 2px var(--wk-background),0 0 0 4px var(--wk-accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--wk-accent);border-color:var(--wk-accent);color:var(--wk-on-accent);font-weight:600}
button.primary:hover:not(:disabled){background:var(--wk-accent-hover);border-color:var(--wk-accent-hover)}
button.primary:active:not(:disabled){background:var(--wk-accent);filter:brightness(.92)}
button.destructive{background:transparent;border-color:rgba(var(--wk-error-rgb),.55);color:var(--wk-error)}
button.destructive:hover:not(:disabled){background:rgba(var(--wk-error-rgb),.12);border-color:var(--wk-error)}
button.sm{padding:4px 11px;font-size:var(--wk-font-size-small)}
button.link{border:0;background:none;padding:0;color:var(--wk-accent);font-weight:500;box-shadow:none}
button.link:hover:not(:disabled){background:none;text-decoration:underline}

/* ---- inputs ---- */
input[type=text],input[type=search],input[type=number],input[type=password],textarea,select{font:inherit;color:var(--wk-text-primary);background:var(--wk-background);border:1px solid var(--wk-border);border-radius:var(--wk-radius-sm);padding:7px 11px;outline:none;transition:border-color var(--wk-anim-fast),box-shadow var(--wk-anim-fast)}
input[type=text]:hover,input[type=search]:hover,input[type=number]:hover,input[type=password]:hover,textarea:hover,select:hover{border-color:rgba(var(--wk-text-primary-rgb),.25)}
input:focus,textarea:focus,select:focus{border-color:var(--wk-accent)!important;box-shadow:0 0 0 3px rgba(var(--wk-accent-rgb),.22)}
input::placeholder,textarea::placeholder{color:var(--wk-text-muted)}
textarea{resize:vertical;font-family:var(--wk-mono);font-size:12.5px}
select{appearance:none;-webkit-appearance:none;padding-right:30px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--wk-text-secondary) 50%),linear-gradient(135deg,var(--wk-text-secondary) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select option{background:var(--wk-surface);color:var(--wk-text-primary)}
input[type=range]{accent-color:var(--wk-accent)}
input[type=checkbox]:not(.wk-switch){accent-color:var(--wk-accent);width:15px;height:15px}
input.wk-switch{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;border:1px solid rgba(var(--wk-text-primary-rgb),.3);background:transparent;position:relative;cursor:pointer;flex:none;margin:0;transition:background var(--wk-anim-fast),border-color var(--wk-anim-fast)}
input.wk-switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--wk-text-secondary);transition:transform var(--wk-anim-fast),background var(--wk-anim-fast)}
input.wk-switch:hover:not(:disabled){border-color:rgba(var(--wk-text-primary-rgb),.5)}
input.wk-switch:checked{background:var(--wk-accent);border-color:var(--wk-accent)}
input.wk-switch:checked::after{transform:translateX(18px);background:var(--wk-on-accent)}
input.wk-switch:disabled{opacity:.5;cursor:default}
input.wk-switch:focus-visible{box-shadow:0 0 0 2px var(--wk-background),0 0 0 4px var(--wk-accent)}

/* ---- tabs (tool pages) ---- */
.wk-tabs{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--wk-border);margin:14px 0 18px}
.wk-tab{padding:8px 12px 10px;color:var(--wk-text-secondary);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:var(--wk-radius-sm) var(--wk-radius-sm) 0 0;outline:none;transition:color var(--wk-anim-fast),background var(--wk-anim-fast)}
.wk-tab:hover{color:var(--wk-text-primary);background:rgba(var(--wk-text-primary-rgb),.05)}
.wk-tab:focus-visible{box-shadow:inset 0 0 0 2px var(--wk-accent)}
.wk-tab.on{color:var(--wk-text-primary);font-weight:600;border-bottom-color:var(--wk-accent)}
.wk-seg{display:inline-flex;border:1px solid var(--wk-border);border-radius:var(--wk-radius-sm);overflow:hidden}
.wk-seg button{border:0;border-radius:0;background:transparent}
.wk-seg button.on{background:var(--wk-accent);color:var(--wk-on-accent)}

/* ---- latency / value tones ---- */
.wk-tone-ok{color:var(--wk-success)}.wk-tone-warn{color:var(--wk-warning)}.wk-tone-bad{color:var(--wk-error)}

/* ---- tables ---- */
.wk-table-wrap{overflow:auto;border:1px solid var(--wk-border);border-radius:var(--wk-radius);background:var(--wk-surface)}
table.wk-table{width:100%;border-collapse:collapse}
.wk-table th{position:sticky;top:0;z-index:1;background:var(--wk-surface);text-align:left;color:var(--wk-text-muted);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--wk-border);white-space:nowrap}
.wk-table th[data-sort]{cursor:pointer}.wk-table th[data-sort]:hover{color:var(--wk-text-primary)}
.wk-table th .arr{margin-left:5px;color:var(--wk-accent)}
.wk-table td{padding:9px 14px;border-bottom:1px solid rgba(var(--wk-border-rgb),.7);vertical-align:middle}
.wk-table tr:last-child td{border-bottom:0}
.wk-table tbody tr:hover td{background:rgba(var(--wk-text-primary-rgb),.04)}
.wk-table tr.sel td{background:rgba(var(--wk-accent-rgb),.14)}
.wk-table .num{text-align:right;font-variant-numeric:tabular-nums}
.wk-table td.ellip{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- misc ---- */
.wk-badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:var(--wk-font-size-small);font-weight:600;background:rgba(var(--wk-accent-rgb),.15);color:var(--wk-accent)}
.wk-badge.ok{background:rgba(var(--wk-success-rgb),.15);color:var(--wk-success)}
.wk-badge.warn{background:rgba(var(--wk-warning-rgb),.15);color:var(--wk-warning)}
.wk-badge.bad{background:rgba(var(--wk-error-rgb),.15);color:var(--wk-error)}
.wk-badge.muted{background:rgba(var(--wk-text-primary-rgb),.08);color:var(--wk-text-muted)}
.wk-progress{height:6px;border-radius:3px;background:rgba(var(--wk-text-primary-rgb),.1);overflow:hidden}
.wk-progress>i{display:block;height:100%;border-radius:3px;background:var(--wk-accent);transition:width var(--wk-anim-normal)}
.wk-progress.indet>i{width:35%;animation:wk-ind 1.1s ease-in-out infinite}
.wk-progress.warn>i{background:var(--wk-warning)}.wk-progress.bad>i{background:var(--wk-error)}
@keyframes wk-ind{0%{margin-left:-35%}100%{margin-left:100%}}
.wk-out{font:12.5px/1.5 var(--wk-mono);background:var(--wk-background);border:1px solid var(--wk-border);border-radius:var(--wk-radius-sm);padding:12px;white-space:pre-wrap;word-break:break-word;overflow:auto;margin:0}
.wk-empty{color:var(--wk-text-muted);padding:32px;text-align:center}
.wk-spin{width:14px;height:14px;border:2px solid var(--wk-border);border-top-color:var(--wk-accent);border-radius:50%;animation:wk-sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes wk-sp{to{transform:rotate(360deg)}}
.wk-kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px}
.wk-kv dt{color:var(--wk-text-muted)}.wk-kv dd{margin:0;word-break:break-word}
.wk-pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border-radius:99px;background:rgba(var(--wk-text-primary-rgb),.06);border:1px solid var(--wk-border);color:var(--wk-text-secondary)}
.wk-pill>i{width:8px;height:8px;border-radius:50%;background:var(--wk-text-muted);flex:none}
.wk-pill.ok>i{background:var(--wk-success)}.wk-pill.warn>i{background:var(--wk-warning)}.wk-pill.bad>i{background:var(--wk-error)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(var(--wk-text-primary-rgb),.18);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--wk-text-primary-rgb),.34);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
[data-wk-animations="off"] *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.wk-page.on{animation:none}}

</style>
</head>
<body>
<div id="wk-root">
<aside id="wk-side"><div class="brand"><span class="wk-logo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5 L4.8 12 L8 6.5 L11.2 12 L14 4.5"/></svg></span><span>WinKit</span></div><nav id="wk-nav"></nav><div class="wk-side-foot" id="wk-side-foot"></div></aside>
<main id="wk-main"></main>
</div>
<script>
/* =====================================================================================================
 * WinKit core.js  -  plain browser script (no modules / bundler / libs, ES2020).  Exposes window.WK.
 * Port of WinKit.Core + WinKit.Infrastructure + WinKit.Themes logic and the UI-side logic of
 * SettingsViewModel, ThemeDraftViewModel, AboutViewModel, OnboardingViewModel, ActivityViewModel,
 * NotificationHostViewModel/NotificationItemViewModel, ThemeApplier, UptimeFormatter, DialogService.
 * Everything that needs the OS is a native command (see API_infra.md); everything persisted goes
 * through the native store commands (store_read/store_write/store_delete/store_list) as JSON files
 * under %LOCALAPPDATA%\WinKit (same file names / JSON shapes as the C# app).
 *
 * PUBLIC API  (all async functions return Promises)
 * -----------------------------------------------------------------------------------------------
 * Bridge / events
 *   WK.native(cmd, args?)            -> Promise<data>   post {id,cmd,...flat string args}; rejects Error(message) on {ok:false}
 *   WK.on(name, fn) -> unsubscribe   WK.off(name, fn)   WK.emit(name, data)
 *   WK.ready                         Promise resolved when init() finished ({onboardingCompleted})   WK.init()  (auto-run once)
 *   WK.version                       core.js API version string
 *   WK.mock                          object {cmd: (args)=>result} used when there is no chrome.webview (browser dev); default mocks for store_*
 * Persistence helper
 *   WK.store.read(name) -> obj|null  WK.store.write(name, obj)  WK.store.remove(name)  WK.store.list(dir) -> string[]
 * App / shell
 *   WK.app.info() -> {version,exePath,exeDir,dataDir,logsDir,themesDir,isAdmin,isInstalledLocation,userName,architecture,windowsVersion,windowsBuild,systemUsesLightTheme}
 *   WK.app.version (string "2.0.0")  WK.app.quit()
 *   WK.shell.openUrl(url)  WK.shell.openFolder(pathOr"@data"|"@logs"|"@themes")  WK.shell.reveal(path)  WK.shell.copy(text) -> bool
 *   WK.admin.isElevated() -> bool    WK.admin.restart() -> Promise<bool>   (confirm dialog + relaunch; shows error dialog on failure)
 *   WK.autostart.get() -> bool       WK.autostart.set(bool)
 * Settings (AppSettingsService + SettingsViewModel behaviour)
 *   WK.settings.get() -> {startMinimized,startWithWindows,notificationsEnabled,themeName,accentOverrideHex,autoCheckForUpdates,skippedUpdateVersion,lastUpdateCheckUtc}
 *   WK.settings.defaults()           WK.settings.set(patch) -> Promise (merge, emit 'settings:changed', save)
 *   WK.settings.setStartMinimized(b) WK.settings.setStartWithWindows(b) WK.settings.setNotificationsEnabled(b) WK.settings.setAutoCheckForUpdates(b)
 *   WK.settings.refreshFromSystem()  (call when the Settings screen opens: re-reads the real auto-start state)
 *   WK.settings.saveName(name) -> bool   (Settings "Save" button: ignores blank, saves profile, toast "Name updated")
 * Profile
 *   WK.profile.current() -> {name,hasCompletedOnboarding}   WK.profile.setName(name) (trims, persists, emits 'profile:changed')
 *   WK.onboarding.defaultName()  WK.onboarding.canContinue(name)  WK.onboarding.submit(name) -> bool
 * Activity log
 *   WK.activity.record(title, kind='Info', detail=null, category='Action')    kind: Info|Success|Warning|Error   category: Action|ThemeAndSettings
 *   WK.activity.entries() newest first (max 50)   WK.activity.filtered('all'|'actions'|'themesAndSettings')   WK.activity.formatTimestamp(entry)
 * Notifications / toasts (rendered by core.js into #wk-toasts; auto-mounted)
 *   WK.notify({title, description?, severity='Info', actionText?, action?:fn, autoDismissMs=3000 (null = stay)}) -> id
 *   WK.toast(title, description?, severity?, opts?) -> id        severity: Success|Error|Warning|Update|Info
 *   WK.notifications.items()  .dismiss(id)  .invoke(id)  .pause(id)  .resume(id)  .dismissAll()
 * Dialogs (modal, rendered by core.js)
 *   WK.confirm({title,message,confirmText='Confirm',cancelText='Cancel',isDestructive=false}) -> Promise<bool>
 *   WK.alert(title, message, technicalDetail?)  (also WK.alert({title,message,technicalDetail}))  -> Promise<void>
 *   WK.showErrorReport(title, message, report) -> Promise<bool sentOK>      WK.updateConfirm(version, releaseNotes) -> Promise<bool>
 * Themes
 *   WK.themes.builtIn() custom() all() names() ("System" first)   WK.themes.current()   WK.themes.find(name)
 *   WK.themes.selected()  (= settings.themeName)   WK.themes.select(name)  (apply + persist + log "Theme changed to X")
 *   WK.themes.apply(name)  WK.themes.preview(theme)  WK.themes.validate(theme) -> {ok,error}   WK.themes.isDark(theme)
 *   WK.themes.saveCustom(theme)  WK.themes.deleteCustom(name)  WK.themes.createDraftFrom(src,newName)  WK.themes.clone(theme)
 *   WK.themes.parse(objectOrJsonText) -> theme|null   WK.themes.serialize(theme) -> JSON text   WK.themes.importFromJson(text) -> theme|null
 *   WK.themes.importFlow() -> {status:'ok'|'cancelled'|'invalid',theme?}   WK.themes.exportFlow()   WK.themes.resetToDefault()   WK.themes.deleteFlow()
 *   WK.themes.applyToDom(theme)  WK.themes.hexToCss(hex) ("#AARRGGBB" -> "#RRGGBBAA")  WK.themes.sanitizeFileName(name)  WK.themes.COLOR_KEYS
 *   WK.themeEditor.openCreate()  .openEditCurrent()  .isOpen()  .draft()  .set(field, value)  .setColor(key, hex)  .save() -> {ok,error?}  .close()
 *       fields: name | density('Comfortable'|'Compact') | cornerRadius(0-24) | sidebarWidth(180-320) | fontScale(0.8-1.4) | animationIntensity('Full'|'Reduced'|'Off')
 *       colors: background surface surfaceElevated border textPrimary textSecondary textMuted accent accentHover onAccent success warning error update
 * Updates / About
 *   WK.updates.check() -> UpdateCheckResult   WK.updates.startAutoChecks()  WK.updates.stopAutoChecks()  (event 'update:review' {result})
 *   WK.about.getState() -> {version,statusText,isChecking,updateAvailable,isInstalling,progress}   WK.about.check()  WK.about.install()
 *   WK.about.skipThisVersion()  WK.about.showPendingUpdate(result)
 * Error reporting
 *   WK.errors.createReport(errorLike, component) -> report   WK.errors.send(report) -> {ok,errorMessage}   WK.errors.show(errorLike, component)
 *   WK.errors.logCrash(text)   (global window error / unhandledrejection handlers are installed automatically; WK.errors.autoHandle=false disables)
 * Formatting (match the C# converters)
 *   WK.fmt.uptime(seconds)  WK.fmt.uptimeMs(ms)  WK.fmt.bytes(n)  WK.fmt.megabytes(mb)  WK.fmt.timestamp(isoString)
 *
 * EVENTS (WK.on): 'ready', 'settings:changed', 'profile:changed', 'activity:changed', 'theme:changed' (theme), 'themes:listChanged',
 *   'themeEditor:changed', 'notifications:changed', 'about:changed', 'update:review' ({result}), plus every native PushEvent by its name
 *   (e.g. 'update_progress' {stage,received,total,percent}).
 * CSS custom properties set on :root by the theme: see API_infra.md ("Theme -> CSS variables").
 * ===================================================================================================== */
(function () {
  'use strict';

  const WK = { version: '1.0.0' };
  window.WK = WK;

  // ------------------------------------------------------------------------------------------------
  // tiny utilities
  // ------------------------------------------------------------------------------------------------
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        const copy = el('button', 'wk-btn wk-btn-small', o.details.copyLabel); copy.type = 'button';
        copy.addEventListener('click', () => bg(WK.shell.copy(o.details.text)));
        box.append(pre, copy); details.append(sum, box); details.open = !!o.details.open; dlg.append(details);
      }
      const status = el('div', 'wk-dialog-status wk-hidden'); dlg.append(status);
      const row = el('div', 'wk-dialog-buttons');
      const mk = (label, cls) => { const b = el('button', 'wk-btn ' + (cls || ''), label); b.type = 'button'; return b; };
      const bPreview = mk('Preview'), bCancel = mk(o.cancel ? o.cancel.label : 'Cancel'), bOk = mk(o.confirm.label, o.confirm.kind === 'destructive' ? 'wk-btn-destructive' : 'wk-btn-primary');
      if (!o.preview) bPreview.classList.add('wk-hidden');
      if (!o.cancel) bCancel.classList.add('wk-hidden');
      row.append(bPreview, bCancel, bOk); dlg.append(row); ov.append(dlg);

      const ctx = {
        details, bPreview, bCancel, bOk, result: false,
        status: (text, kind) => { status.textContent = text; status.dataset.kind = kind || ''; status.classList.toggle('wk-hidden', !text); },
        close: (v) => {
          document.removeEventListener('keydown', onKey, true); ov.remove();
          try { if (prevFocus && prevFocus.focus) prevFocus.focus(); } catch (_) { /* ignore */ }
          resolve(v);
        },
      };
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); (o.cancel && !bCancel.classList.contains('wk-hidden') ? bCancel : bOk).click(); }
        else if (e.key === 'Enter') {
          const t = e.target;
          if (t && (t.tagName === 'BUTTON' || t.tagName === 'SUMMARY' || t.tagName === 'TEXTAREA')) return;
          e.preventDefault(); if (!bOk.disabled) bOk.click();
        } else if (e.key === 'Tab') {
          const f = Array.from(dlg.querySelectorAll('button:not(:disabled):not(.wk-hidden), summary')).filter((x) => x.offsetParent !== null);
          if (!f.length) return;
          const i = f.indexOf(document.activeElement);
          if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
          else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
        }
      }
      bCancel.addEventListener('click', () => ctx.close(o.onCancelResult !== undefined ? ctx.result : false));
      bPreview.addEventListener('click', () => { if (details) details.open = !details.open; });
      bOk.addEventListener('click', () => { if (o.onConfirm) bg(o.onConfirm(ctx)); else ctx.close(true); });
      document.addEventListener('keydown', onKey, true);
      document.body.appendChild(ov);
      (o.confirm.kind === 'destructive' && o.cancel ? bCancel : bOk).focus();
    });
  }

  WK.confirm = (req) => enqueue(() => openDialog({
    title: req.title, message: req.message,
    cancel: { label: req.cancelText || 'Cancel' },
    confirm: { label: req.confirmText || 'Confirm', kind: req.isDestructive ? 'destructive' : 'primary' },
  }));
  WK.alert = (title, message, technicalDetail) => {
    if (title && typeof title === 'object') { technicalDetail = title.technicalDetail; message = title.message; title = title.title; }
    return enqueue(() => openDialog({
      title: String(title), message: String(message == null ? '' : message), cancel: null, confirm: { label: 'OK', kind: 'primary' },
      details: blank(technicalDetail) ? null : { header: 'Technical details', text: String(technicalDetail), copyLabel: 'Copy details', open: false },
    })).then(() => undefined);
  };
  WK.updateConfirm = (version, releaseNotes) => enqueue(() => openDialog({
    title: 'WinKit ' + version + ' is available',
    message: "Review what's changed, then choose whether to install it now. Your settings, themes, and activity history are preserved.",
    cancel: { label: 'Cancel' }, confirm: { label: 'Install Update', kind: 'primary' },
    details: blank(releaseNotes) ? null : { header: "What's new", text: String(releaseNotes), copyLabel: 'Copy changelog', open: true },
  }));
  WK.showErrorReport = (title, message, report) => enqueue(() => {
    let sent = false;
    return openDialog({
      title, message, errorId: report.errorId, preview: true,
      details: { header: 'Preview report', text: report.text, copyLabel: 'Copy report', open: false },
      cancel: { label: 'Close' }, confirm: { label: 'Send to Developers', kind: 'primary' }, onCancelResult: true,
      onConfirm: async (ctx) => {
        ctx.bOk.disabled = true; ctx.bPreview.disabled = true; ctx.status('Sending...', '');
        const r = await WK.errors.send(report);
        if (r.ok) {
          sent = true; ctx.result = true;
          ctx.status('Error report sent successfully. Report ID: ' + report.errorId, 'success');
          ctx.bPreview.classList.add('wk-hidden'); ctx.bOk.classList.add('wk-hidden'); ctx.bCancel.textContent = 'Close'; ctx.bCancel.focus();
        } else {
          ctx.status("Couldn't send the report: " + r.errorMessage + " The report hasn't been lost \u2014 you can retry or copy it.", 'error');
          ctx.bOk.textContent = 'Retry'; ctx.bOk.disabled = false; ctx.bPreview.disabled = false;
        }
      },
    }).then(() => sent);
  });

  // ------------------------------------------------------------------------------------------------
  // notifications  (NotificationService + NotificationHostViewModel + NotificationItemViewModel)
  // ------------------------------------------------------------------------------------------------
  const SEVERITIES = ['Success', 'Error', 'Warning', 'Update', 'Info'];
  let notes = [];            // newest first
  let noteSeq = 0;
  const noteById = (id) => notes.find((n) => n.id === id);
  const notesChanged = () => { renderToasts(); WK.emit('notifications:changed', WK.notifications.items()); };

  function startNoteTimer(n) {
    if (n.autoDismissMs == null) return;
    n.timerStarted = Date.now(); clearTimeout(n.timer);
    n.timer = setTimeout(() => { n.timer = null; n.timerActive = false; WK.notifications.dismiss(n.id); }, Math.max(0, n.remaining));
    n.timerActive = true;
  }
  WK.notify = function (req) {
    const r = req || {};
    const sev = SEVERITIES.find((s) => s.toLowerCase() === String(r.severity || 'Info').toLowerCase()) || 'Info';
    const n = {
      id: ++noteSeq, title: String(r.title == null ? '' : r.title), description: blank(r.description) ? null : String(r.description), severity: sev,
      actionText: blank(r.actionText) ? null : String(r.actionText), action: typeof r.action === 'function' ? r.action : null,
      visible: true, animationsEnabled: animIntensity !== 'Off',
      autoDismissMs: r.autoDismissMs === undefined ? 3000 : (r.autoDismissMs === null ? null : Number(r.autoDismissMs)),
      timer: null, timerActive: false, timerStarted: 0, remaining: 0, tag: r.tag || null,
    };
    if (n.autoDismissMs != null) { n.remaining = n.autoDismissMs; startNoteTimer(n); }
    notes.unshift(n); notesChanged();
    return n.id;
  };
  WK.toast = (title, description, severity, opts) => WK.notify(Object.assign({ title, description, severity }, opts || {}));
  WK.notifications = {
    items: () => notes.map((n) => ({ id: n.id, title: n.title, description: n.description, severity: n.severity, actionText: n.actionText, visible: n.visible, animationsEnabled: n.animationsEnabled, tag: n.tag })),
    pause: function (id) {
      const n = noteById(id); if (!n || !n.timerActive) return;
      clearTimeout(n.timer); n.timer = null; n.timerActive = false;
      n.remaining = Math.max(0, n.remaining - (Date.now() - n.timerStarted));
    },
    resume: function (id) {
      const n = noteById(id); if (!n || n.autoDismissMs == null || n.timerActive || !n.visible) return;
      if (n.remaining <= 0) { WK.notifications.dismiss(id); return; }
      startNoteTimer(n);
    },
    dismiss: async function (id) {
      const n = noteById(id); if (!n || !n.visible) return;
      clearTimeout(n.timer); n.timer = null; n.timerActive = false;
      n.visible = false; notesChanged();
      if (n.animationsEnabled) await sleep(160);
      notes = notes.filter((x) => x !== n); notesChanged();
    },
    invoke: async function (id) {
      const n = noteById(id); if (!n) return;
      if (n.action) { try { n.action(); } catch (e) { try { console.error(e); } catch (_) { /* ignore */ } } }
      await WK.notifications.dismiss(id);
    },
    dismissAll: () => Promise.all(notes.map((n) => WK.notifications.dismiss(n.id))).then(() => undefined),
  };

  const toastEls = new Map();
  function renderToasts() {
    if (!document.body) return;
    injectCss();
    let host = document.getElementById('wk-toasts');
    if (!host) { host = el('div'); host.id = 'wk-toasts'; host.setAttribute('aria-live', 'polite'); document.body.appendChild(host); }
    const ids = new Set(notes.map((n) => n.id));
    for (const [id, e] of Array.from(toastEls)) if (!ids.has(id)) { e.remove(); toastEls.delete(id); }
    let prev = null;
    for (const n of notes) { // notes are newest first => DOM order top -> bottom
      let e = toastEls.get(n.id);
      if (!e) {
        e = el('div', 'wk-toast'); e.dataset.severity = n.severity; e.dataset.anim = n.animationsEnabled ? 'on' : 'off';
        e.setAttribute('role', n.severity === 'Error' ? 'alert' : 'status');
        const body = el('div', 'wk-toast-body');
        body.append(el('div', 'wk-toast-title', n.title));
        if (n.description) body.append(el('div', 'wk-toast-desc', n.description));
        if (n.actionText) { const b = el('button', 'wk-btn wk-btn-small', n.actionText); b.type = 'button'; b.addEventListener('click', () => bg(WK.notifications.invoke(n.id))); body.append(b); }
        const x = el('button', 'wk-toast-close', '\u00d7'); x.type = 'button'; x.setAttribute('aria-label', 'Dismiss'); x.addEventListener('click', () => bg(WK.notifications.dismiss(n.id)));
        e.append(el('div', 'wk-toast-bar'), body, x);
        e.addEventListener('mouseenter', () => WK.notifications.pause(n.id));
        e.addEventListener('mouseleave', () => WK.notifications.resume(n.id));
        toastEls.set(n.id, e);
        if (n.animationsEnabled) requestAnimationFrame(() => requestAnimationFrame(() => e.classList.add('wk-in'))); else e.classList.add('wk-in');
      }
      if (!n.visible) e.classList.add('wk-leaving');
      if (e.parentNode !== host || e.previousSibling !== prev) host.insertBefore(e, prev ? prev.nextSibling : host.firstChild);
      prev = e;
    }
  }

  // ------------------------------------------------------------------------------------------------
  // error reporting
  // ------------------------------------------------------------------------------------------------
  const errParts = (err) => {
    if (err && typeof err === 'object') {
      return { exceptionType: err.name || (err.constructor && err.constructor.name) || 'Error', exceptionMessage: err.message != null ? String(err.message) : String(err), stackTrace: err.stack ? String(err.stack) : '' };
    }
    return { exceptionType: 'Error', exceptionMessage: String(err), stackTrace: '' };
  };
  let reportOpen = false, lastReportAt = 0;
  WK.errors = {
    autoHandle: true,
    createReport: (err, component) => WK.native('error_report_create', Object.assign({ component: component || 'Unhandled Exception' }, errParts(err))),
    send: async function (report) {
      try {
        return await WK.native('error_report_send', { errorId: report.errorId, winKitVersion: report.winKitVersion, windowsVersion: report.windowsVersion, architecture: report.architecture, component: report.component, exceptionType: report.exceptionType, exceptionMessage: report.exceptionMessage, stackTrace: report.stackTrace, timestamp: report.timestamp });
      } catch (e) { return { ok: false, errorMessage: errMsg(e) }; }
    },
    logCrash: (text) => WK.native('crash_log', { text: String(text) }),
    show: async function (err, component) {
      if (reportOpen) return false;
      reportOpen = true;
      try {
        const p = errParts(err);
        bg(WK.errors.logCrash(p.exceptionType + ': ' + p.exceptionMessage + '\n' + p.stackTrace));
        const report = await WK.errors.createReport(err, component);
        return await WK.showErrorReport('Something went wrong', 'WinKit ran into an unexpected error. You can keep using the app, but some features may not work correctly until you restart.', report);
      } catch (_) { return false; }
      finally { reportOpen = false; }
    },
  };
  function installErrorHandlers() {
    const handle = (err, component) => {
      if (!WK.errors.autoHandle) return;
      const m = String(err && err.message || err || '');
      if (/ResizeObserver loop/i.test(m)) return;
      const now = Date.now(); if (now - lastReportAt < 1000) return; lastReportAt = now;
      bg(WK.errors.show(err, component));
    };
    window.addEventListener('error', (e) => { if (e.error || e.message) handle(e.error || new Error(e.message), 'Unhandled Exception'); });
    window.addEventListener('unhandledrejection', (e) => handle(e.reason, 'Unhandled Promise Rejection'));
  }

  // ------------------------------------------------------------------------------------------------
  // updates + About
  // ------------------------------------------------------------------------------------------------
  const UPDATE_INTERVAL_MS = 6 * 3600 * 1000;
  let updateTimer = null;
  const checkNative = async function () {
    try { return await WK.native('update_check'); } catch (e) { return { status: 'Failed', errorMessage: errMsg(e) }; }
  };
  WK.updates = {
    check: checkNative,
    backgroundCheck: async function () { // App.CheckForUpdatesInBackgroundAsync
      try {
        const result = await checkNative();
        await WK.settings.set({ lastUpdateCheckUtc: new Date().toISOString() });
        if (result.status !== 'UpdateAvailable') return result;
        if (settings.skippedUpdateVersion && String(result.latestVersion).toLowerCase() === String(settings.skippedUpdateVersion).toLowerCase()) return result;
        if (notes.some((n) => n.tag === 'update:' + result.latestVersion)) return result; // don't stack duplicates every 6 h
        WK.notify({
          title: 'WinKit ' + result.latestVersion + ' is available', description: "Click to review what's changed and install it.", severity: 'Update',
          actionText: 'Update Now', autoDismissMs: null, tag: 'update:' + result.latestVersion,
          action: () => WK.emit('update:review', { result }),
        });
        return result;
      } catch (_) { return null; }
    },
    startAutoChecks: function () {
      WK.updates.stopAutoChecks();
      bg(WK.updates.backgroundCheck());
      updateTimer = setInterval(() => bg(WK.updates.backgroundCheck()), UPDATE_INTERVAL_MS);
    },
    stopAutoChecks: function () { if (updateTimer) clearInterval(updateTimer); updateTimer = null; },
  };

  const aboutState = { version: '1.0.0', statusText: 'Check for updates to see if a newer version is available.', isChecking: false, updateAvailable: false, isInstalling: false, progress: null };
  let lastCheck = null;
  const aboutChanged = () => WK.emit('about:changed', WK.about.getState());
  WK.about = {
    getState: () => Object.assign({}, aboutState),
    lastResult: () => (lastCheck ? clone(lastCheck) : null),
    check: async function () {
      aboutState.isChecking = true; aboutState.statusText = 'Checking for updates...'; aboutChanged();
      try {
        const result = await checkNative(); lastCheck = result;
        await WK.settings.set({ lastUpdateCheckUtc: new Date().toISOString() });
        aboutState.updateAvailable = result.status === 'UpdateAvailable';
        aboutState.statusText = result.status === 'UpToDate' ? "You're on the latest version."
          : result.status === 'UpdateAvailable' ? 'WinKit ' + result.latestVersion + ' is available.'
            : "Couldn't check for updates: " + (result.errorMessage || 'unknown error');
      } finally { aboutState.isChecking = false; aboutChanged(); }
    },
    showPendingUpdate: async function (result) {
      lastCheck = result; aboutState.updateAvailable = result.status === 'UpdateAvailable';
      aboutState.statusText = aboutState.updateAvailable ? 'WinKit ' + result.latestVersion + ' is available.' : "You're on the latest version.";
      aboutChanged();
      if (aboutState.updateAvailable) await WK.about.install();
    },
    install: async function () {
      if (!lastCheck || lastCheck.status !== 'UpdateAvailable') return;
      const ok = await WK.updateConfirm(lastCheck.latestVersion || '', lastCheck.releaseNotes);
      if (!ok) return;
      aboutState.statusText = 'Downloading update...'; aboutState.isInstalling = true; aboutState.progress = null; aboutChanged();
      let res;
      try { res = await WK.native('update_download_apply', { latestVersion: lastCheck.latestVersion || '' }); }
      catch (e) { res = { status: 'Failed', errorMessage: errMsg(e) }; }
      aboutState.isInstalling = false; aboutState.progress = null;
      if (res.status === 'Started') {
        WK.activity.record('Updating to ' + lastCheck.latestVersion, 'Info');
        aboutChanged();
        try { await WK.app.quit(); } catch (_) { /* ignore */ }
      } else {
        aboutState.statusText = 'Update failed: ' + (res.errorMessage || 'unknown error'); aboutChanged();
        await WK.alert('Update failed', res.errorMessage || 'The update could not be applied.');
      }
    },
    skipThisVersion: async function () {
      if (!lastCheck || !lastCheck.latestVersion) return;
      await WK.settings.set({ skippedUpdateVersion: lastCheck.latestVersion });
      aboutState.updateAvailable = false;
      aboutState.statusText = 'Skipped version ' + lastCheck.latestVersion + ". You'll be notified again for future releases.";
      aboutChanged();
    },
  };
  WK.on('update_progress', (p) => { if (aboutState.isInstalling) { aboutState.progress = p; aboutChanged(); } });

  // ------------------------------------------------------------------------------------------------
  // init  (mirrors App.OnStartup)
  // ------------------------------------------------------------------------------------------------
  let initPromise = null;
  WK.init = function () {
    if (initPromise) return initPromise;
    initPromise = (async () => {
      const step = async (fn) => { try { await fn(); } catch (e) { try { console.error('[WK] init step failed', e); } catch (_) { /* ignore */ } } };
      if (!document.body) await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
      injectCss();
      await step(async () => { const i = await WK.app.info(); elevated = !!(i && i.isAdmin); aboutState.version = (i && i.version) || aboutState.version; });
      await step(() => WK.profile.load());
      await step(() => WK.settings.load());
      await step(() => WK.activity.load());
      await step(() => WK.themes.init());
      await step(() => WK.themes.apply(settings.themeName));
      installErrorHandlers();
      renderToasts();
      if (settings.autoCheckForUpdates) WK.updates.startAutoChecks();
      const info = { onboardingCompleted: WK.profile.current().hasCompletedOnboarding };
      WK.emit('ready', info);
      return info;
    })();
    return initPromise;
  };
  WK.ready = new Promise((resolve) => { WK.on('ready', resolve); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => bg(WK.init()), { once: true });
  else bg(WK.init());
})();

</script>
<script>
/* shell.js - sidebar, page registry, router, helpers shared by all pages.  Loads AFTER core.js, BEFORE pages/*.js.
 *
 * PAGE CONTRACT (each pages/*.js file is an IIFE that calls this once per page):
 *   WK.pages.register('system', {
 *     title: 'System',                    // used for aria + nothing else (pages draw their own h1)
 *     create(root) { ... build DOM into `root` (a div.wk-page) ...; return { show(), hide() } },  // create() runs on first visit
 *   });
 *   show() is called every time the page becomes visible (do refresh/load there; may be async), hide() when it leaves. Both optional.
 * ROUTER:   WK.nav.go('diagnostics', { tab: 'x' })  -> shows the page, passes opts to its show(opts). WK.nav.current() -> id.
 * HELPERS (window.WK.ui):
 *   el(tag, attrs?, ...children)                    tiny DOM builder; attrs: class, text, html(use sparingly), on* handlers, any attribute; children: nodes|strings|arrays
 *   esc(s)                                          HTML-escape for innerHTML templates
 *   tabsPage(root, title, tabs, subtitle?)          System/Network style page: big title (+ optional subtitle) + tab strip. tabs = [{id,title,create(panel)->{show?,hide?}}] ; returns {select(id), current()}; a tab's create() runs on its first selection, its show() on every selection.
 *   sortableTable(table, getRows, columns)          optional helper, see its comment
 *   busy(button, promiseFn)                         disables button while promiseFn() runs
 *   logo(large?)                                    the WinKit logo mark (span.wk-logo) for headers / empty states
 */
(function () {
  'use strict';
  const W = window.WK = window.WK || {};
  const ui = W.ui = {};

  ui.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  ui.el = function (tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k]; if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k === 'html') n.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if (k === 'value') n.value = v; else if (k === 'checked') n.checked = !!v; else if (k === 'disabled') n.disabled = !!v;
      else n.setAttribute(k, v === true ? '' : v);
    }
    const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else n.append(k.nodeType ? k : document.createTextNode(String(k))); };
    kids.forEach(add); return n;
  };
  ui.busy = async function (btn, fn) { btn.disabled = true; try { return await fn(); } finally { btn.disabled = false; } };
  ui.logo = function (large) { return ui.el('span', { class: 'wk-logo' + (large ? ' lg' : ''), html: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5 L4.8 12 L8 6.5 L11.2 12 L14 4.5"/></svg>' }); };

  ui.tabsPage = function (root, title, tabs, subtitle) {
    const strip = ui.el('div', { class: 'wk-tabs', role: 'tablist', 'aria-label': title });
    const body = ui.el('div');
    root.append(ui.el('div', { class: 'wk-pagehead' }, ui.el('h1', { class: 'wk-display', text: title }), subtitle ? ui.el('div', { class: 'wk-sub', text: subtitle }) : null), strip, body);
    const st = {}; let cur = null;
    tabs.forEach((t, i) => {
      t.tabEl = ui.el('div', { class: 'wk-tab', role: 'tab', 'aria-selected': 'false', text: t.title, tabindex: 0, onclick: () => select(t.id), onkeydown: e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(t.id); }
        else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {                       // arrow keys move between tabs
          e.preventDefault(); const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; select(n.id); n.tabEl.focus();
        }
      } });
      t.panel = ui.el('div', { class: 'wk-hide', role: 'tabpanel' }); strip.append(t.tabEl); body.append(t.panel); st[t.id] = t;
    });
    function select(id) {
      const t = st[id]; if (!t) return;
      if (cur && cur !== t) { cur.panel.classList.add('wk-hide'); cur.tabEl.classList.remove('on'); cur.tabEl.setAttribute('aria-selected', 'false'); cur.api && cur.api.hide && cur.api.hide(); }
      cur = t; t.tabEl.classList.add('on'); t.tabEl.setAttribute('aria-selected', 'true'); t.panel.classList.remove('wk-hide');
      if (!t.api) t.api = t.create(t.panel) || {};
      t.api.show && t.api.show();
    }
    return { select, current: () => cur && cur.id, hide: () => { cur && cur.api && cur.api.hide && cur.api.hide(); }, showCurrent: () => { cur && cur.api && cur.api.show && cur.api.show(); } };
  };

  /* sortableTable(table, getRows, columns): columns = [{key, title, num?, sort?:(a,b)=>n, render?:(row)=>Node|string, cls?}]
     returns { render(), setSort(key, dir), selected() } ; clicking a header toggles sort; getRows() returns the (already filtered) array. */
  ui.sortableTable = function (table, getRows, columns, opts) {
    opts = opts || {}; let sortKey = opts.sortKey || null, dir = opts.dir || 1, selRow = null;
    table.classList.add('wk-table');
    const thead = ui.el('thead'), tbody = ui.el('tbody'); table.append(thead, tbody);
    function head() {
      thead.replaceChildren(ui.el('tr', null, columns.map(c => ui.el('th', { class: c.num ? 'num' : '', 'data-sort': c.sortable === false ? null : c.key, onclick: () => { if (c.sortable === false) return; if (sortKey === c.key) dir = -dir; else { sortKey = c.key; dir = 1; } render(); } },
        c.title, sortKey === c.key ? ui.el('span', { class: 'arr', text: dir > 0 ? '▲' : '▼' }) : null))));
    }
    function render() {
      head(); let rows = getRows().slice();
      const c = columns.find(x => x.key === sortKey);
      if (c) rows.sort((a, b) => dir * (c.sort ? c.sort(a, b) : (a[c.key] < b[c.key] ? -1 : a[c.key] > b[c.key] ? 1 : 0)));
      tbody.replaceChildren(...rows.map(r => {

          columns.map(c2 => { const v = c2.render ? c2.render(r) : r[c2.key]; return ui.el('td', { class: (c2.num ? 'num ' : '') + (c2.cls || '') }, v == null ? '' : v); }));

  const NAV = [
    { id: 'dashboard', title: 'Dashboard', icon: 'dashboard' },
    { header: 'Tools' },
    { id: 'system', title: 'System', icon: 'system' },
    { id: 'network', title: 'Network', icon: 'network' },
    { id: 'cleanup', title: 'Cleanup', icon: 'cleanup' },
    { id: 'diagnostics', title: 'Diagnostics', icon: 'diagnostics' },
    { header: 'App' },
    { id: 'activity', title: 'Activity', icon: 'activity' },
    { id: 'settings', title: 'Settings', icon: 'settings' },
    { id: 'about', title: 'About', icon: 'about' }

  NAV.filter(n => n.id).forEach((n, i) => { n.key = i + 1; });

  // ---- page registry + router ----
  const reg = {}, inst = {}; let cur = null;
  W.pages = { register(id, def) { reg[id] = def; } };
  W.nav = {
    current: () => cur,
    go(id, opts) {
      const def = reg[id]; if (!def) { console.warn('no page', id); return; }
      const main = document.getElementById('wk-main');
      if (!inst[id]) {
        const root = ui.el('div', { class: 'wk-page' + (def.flush ? ' flush' : ''), id: 'page-' + id, 'aria-label': def.title || id });
        main.append(root); inst[id] = { root, api: null };

      }
      if (cur && cur !== id) { const p = inst[cur]; p.root.classList.remove('on'); p.api.hide && p.api.hide(); }
      cur = id; inst[id].root.classList.add('on');
      document.querySelectorAll('.wk-nav-item').forEach(n => n.classList.toggle('on', n.dataset.id === id));
      document.body.classList.toggle('onboarding', id === 'onboarding');
      try { const r = inst[id].api.show && inst[id].api.show(opts || {}); if (r && r.catch) r.catch(e => console.error(e)); } catch (e) { console.error(e); }
    }
  };

  function buildSidebar() {
    const nav = document.getElementById('wk-nav');
    NAV.forEach(n => {
      if (n.header) { nav.append(ui.el('div', { class: 'wk-nav-head', text: n.header })); return; }
      const svg = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${W.icons[n.icon]}"/></svg>`;
      nav.append(ui.el('div', { class: 'wk-nav-item', 'data-id': n.id, tabindex: 0, role: 'button', 'aria-label': n.title, onclick: () => W.nav.go(n.id), title: n.title + '  (Ctrl+' + n.key + ')',
        onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); W.nav.go(n.id); } }, html: svg + '<span></span>' }));
      nav.lastChild.lastChild.textContent = n.title;
    });
  }

  function buildSidebarFooter() {
    const foot = document.getElementById('wk-side-foot'); if (!foot) return;
    const ver = ui.el('span', { text: 'v' + W.app.version });
    const admin = ui.el('span', { class: 'wk-badge ok', title: 'WinKit is running with administrator rights', text: 'Admin' });
    foot.replaceChildren(...[ver, W.admin && W.admin.isElevated() ? admin : null].filter(Boolean));
  }

  // Ctrl+1 .. Ctrl+8 jump straight to a page (ignored while a dialog is open or during first-run setup)
  function installShortcuts() {
    document.addEventListener('keydown', (e) => {
      if (!e.ctrlKey || e.altKey || e.shiftKey || e.metaKey || !/^[1-9]$/.test(e.key)) return;
      if (document.querySelector('.wk-overlay') || W.nav.current() === 'onboarding') return;

      if (target) { e.preventDefault(); W.nav.go(target.id); }
    });
  }

  W.boot = async function () {
    buildSidebar(); installShortcuts();
    let first = 'dashboard';
    try { const r = await W.ready; if (r && r.onboardingCompleted === false) first = 'onboarding'; } catch (e) { console.error(e); }
    try { buildSidebarFooter(); } catch (e) { console.error(e); }
    if (W.on) W.on('update:review', ({ result }) => { W.nav.go('about'); if (W.about && W.about.showPendingUpdate) W.about.showPendingUpdate(result); });
    W.nav.go(first);
  };
})();

<script>
/* pages/cleanup.js - Cleanup page (port of CleanupView + CleanupViewModel + CleanupCategoryItemViewModel).
 * Scans on every visit (C# InitializeAsync), keeps the user's checkbox state across rescans, pre-selects everything except RecycleBin. */
(function () {
  'use strict';
  const WK = window.WK, el = WK.ui.el;

  const css = `
.cln-wrap{display:flex;flex-direction:column;height:100%;min-height:380px}
.cln-sub{margin:4px 0 18px}
.cln-list{flex:1;min-height:0;overflow:auto;max-width:700px;padding-right:4px}
.cln-item{display:grid;grid-template-columns:auto 1fr auto;column-gap:14px;align-items:start;margin-bottom:10px;cursor:pointer}
.cln-item.off .cln-size{color:var(--wk-text-muted)}
.cln-item input{margin-top:3px}
.cln-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cln-desc{margin:2px 0 4px}
.cln-loc{word-break:break-all}
.cln-sizebox{text-align:right;align-self:center;white-space:nowrap}
.cln-size{font-size:var(--wk-font-size-heading);font-weight:600}
.cln-bar{height:4px;width:96px;margin:6px 0 0 auto}
.cln-prog{margin-top:2px;color:var(--wk-accent);font-size:var(--wk-font-size-small)}
.cln-foot{max-width:700px;margin-top:16px;display:flex;align-items:center;gap:12px}
.cln-foot .cln-sel{flex:1;min-width:0}
.cln-foot button{padding:7px 14px}
.cln-foot button.destructive{padding:7px 16px}
.cln-status{max-width:700px;margin:0 0 10px;display:flex;align-items:center;gap:10px;min-height:20px}
.cln-status .wk-progress{flex:1}
`;
  document.head.appendChild(el('style', { 'data-for': 'cln', text: css }));

  const gb = (n) => String(Math.round((Number(n) || 0) * 100) / 100);   // .NET "0.##"
  const errText = (e) => (e && e.message) ? e.message : String(e);
  let opSeq = 0;
  const newOp = (p) => p + '-' + Date.now().toString(36) + '-' + (++opSeq);

  WK.pages.register('cleanup', {
    title: 'Cleanup',
    create(root) {
      let items = [];            // {scan, selected}
      let isScanning = false, isCleaning = false, rescanQueued = false, scanOp = null, elevated = null, lastSummary = '';
      const progress = {};       // category -> text while cleaning

      const list = el('div', { class: 'cln-list' });
      const statusText = el('span', { class: 'wk-secondary' });
      const bar = el('div', { class: 'wk-progress indet', style: 'max-width:200px' }, el('i'));
      const cancelScan = el('button', { class: 'sm', text: 'Cancel', onclick: () => { if (scanOp) WK.native('cleanup_cancel', { opId: scanOp }).catch(() => {}); } });
      const status = el('div', { class: 'cln-status wk-hide' }, el('span', { class: 'wk-spin' }), statusText, bar, cancelScan);
      const selLabel = el('span', { style: 'font-weight:600' });
      const sumLabel = el('div', { class: 'wk-muted', style: 'margin-top:2px' });
      const rescan = el('button', { text: 'Rescan', onclick: () => scan() });
      const clean = el('button', { class: 'destructive', text: 'Clean up', onclick: cleanSelected });
      const foot = el('div', { class: 'wk-card cln-foot' },
        el('div', { class: 'cln-sel' }, el('div', null, 'Selected: ', selLabel), sumLabel), rescan, clean);

      root.append(el('div', { class: 'cln-wrap' },
        el('h1', { class: 'wk-display', text: 'Cleanup' }),
        el('div', { class: 'wk-secondary cln-sub', text: 'Review what each category will remove before cleaning up.' }),
        status, list, foot));

      const selected = () => items.filter(i => i.selected);
      function renderStatus(text) {
        const busy = isScanning || isCleaning;
        status.classList.toggle('wk-hide', !busy);
        cancelScan.classList.toggle('wk-hide', !isScanning || isCleaning);
        if (busy) statusText.textContent = text || (isCleaning ? 'Cleaning...' : 'Scanning...');
      }
      function renderFoot() {
        const sel = selected();
        selLabel.textContent = gb(sel.reduce((s, i) => s + (Number(i.scan.sizeGb) || 0), 0)) + ' GB';
        sumLabel.textContent = lastSummary;
        const busy = isScanning || isCleaning;
        rescan.disabled = busy; clean.disabled = busy || sel.length === 0;
      }
      function renderList() {
        if (!items.length) {
          list.replaceChildren(el('div', { class: 'wk-card wk-muted', text: isScanning ? 'Scanning your system...' : 'No cleanup categories found.' }));
          return;
        }
        const maxBytes = Math.max(1, ...items.map(i => Number(i.scan.sizeBytes) || 0));
        list.replaceChildren(...items.map(it => {
          const s = it.scan, cb = el('input', { type: 'checkbox', checked: it.selected, disabled: isCleaning, onclick: (e) => e.stopPropagation(),
            onchange: () => { it.selected = cb.checked; card.classList.toggle('off', !it.selected); renderFoot(); } });
          const loc = (s.locations && s.locations[0]) || '';
          const badges = [];
          if (s.category === 'RecycleBin') badges.push(el('span', { class: 'wk-badge warn', text: 'Not selected by default' }));
          if (s.needsAdmin && elevated === false) badges.push(el('span', { class: 'wk-badge muted', title: 'Some files may be skipped unless WinKit runs as administrator.', text: 'Admin needed for protected files' }));
          const card = el('div', { class: 'wk-card cln-item' + (it.selected ? '' : ' off'), onclick: (e) => { if (isCleaning) return; cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); } },
            cb,
            el('div', { style: 'min-width:0' },
              el('div', { class: 'cln-name' }, el('span', { class: 'wk-title', text: s.displayName || s.category }), badges),
              el('div', { class: 'wk-secondary cln-desc', text: s.description || '' }),
              el('div', { class: 'wk-muted cln-loc', text: (s.fileCount == null ? 0 : s.fileCount) + ' items - ' + loc }),
              progress[s.category] ? el('div', { class: 'cln-prog', text: progress[s.category] }) : null),
            el('div', { class: 'cln-sizebox' }, el('div', { class: 'cln-size', text: gb(s.sizeGb) + ' GB' }), el('div', { class: 'wk-muted', text: WK.fmt.bytes(s.sizeBytes) }),
              el('div', { class: 'wk-progress cln-bar', 'aria-hidden': 'true' }, el('i', { style: 'width:' + Math.max(2, Math.round((Number(s.sizeBytes) || 0) / maxBytes * 100)) + '%' }))));
          return card;
        }));
      }
      const renderAll = (t) => { renderList(); renderFoot(); renderStatus(t); };

      async function scan() {
        if (isCleaning) return;
        if (isScanning) { rescanQueued = true; return; }       // a scan is still winding down (e.g. cancelled by leaving the page): run again after it
        isScanning = true; rescanQueued = false; const op = scanOp = newOp('cscan'); let n = 0;
        const off = WK.on('cleanup_scan_category', (d) => { if (d && d.opId === op) renderStatus('Scanning... ' + (++n) + ' categories done'); });
        renderAll();
        try {
          const res = await WK.native('cleanup_scan', { opId: op });
          if (res && !res.cancelled) {
            const prev = new Map(items.map(i => [i.scan.category, i.selected]));
            elevated = !!res.isElevated;
            items = (res.categories || []).map(sc => ({ scan: sc, selected: prev.has(sc.category) ? prev.get(sc.category) : (sc.category !== 'RecycleBin' && sc.defaultSelected !== false) }));
          }
        } catch (e) {
          WK.alert('Scan failed', errText(e));
        } finally { isScanning = false; scanOp = null; off(); renderAll(); }
        if (rescanQueued && !isCleaning) { rescanQueued = false; await scan(); }
      }

      async function cleanSelected() {
        const sel = selected();
        if (!sel.length || isScanning || isCleaning) return;
        const ok = await WK.confirm({
          title: 'Clean selected items',
          message: 'This will remove ' + gb(sel.reduce((s, i) => s + (Number(i.scan.sizeGb) || 0), 0)) + ' GB across ' + sel.length + ' categor' + (sel.length === 1 ? 'y' : 'ies') + ". This can't be undone.",
          confirmText: 'Clean up', isDestructive: true });
        if (!ok) return;
        isCleaning = true; for (const k in progress) delete progress[k];
        const op = newOp('crun');
        const offP = WK.on('cleanup_progress', (d) => { if (d && d.opId === op) { progress[d.category] = d.message; renderAll(d.message); } });
        const offD = WK.on('cleanup_category_done', (d) => { if (d && d.opId === op && d.result) {
          const r = d.result; progress[r.category] = 'Freed ' + WK.fmt.bytes(r.bytesFreed) + ' - ' + r.filesRemoved + ' removed' + (r.filesSkipped ? ', ' + r.filesSkipped + ' skipped' : ''); renderAll('Cleaning...'); } });
        renderAll('Cleaning...');
        try {
          const res = await WK.native('cleanup_run', { categories: sel.map(i => i.scan.category).join(','), opId: op });
          if (res && res.success) {
            const g = gb(res.summary && res.summary.gbFreed);
            WK.activity.record(g + ' GB of files removed', 'Success');
            WK.toast('Cleanup completed', g + ' GB of temporary files removed.', 'Success');
            lastSummary = 'Last cleanup: ' + WK.fmt.bytes(res.summary.bytesFreed) + ' freed, ' + res.summary.filesRemoved + ' removed' + (res.summary.filesSkipped ? ', ' + res.summary.filesSkipped + ' skipped' : '') + '.';
            if (res.userMessage) WK.toast('Some items were skipped', res.userMessage, 'Warning');
          } else {
            WK.alert('Cleanup failed', (res && res.userMessage) || 'Unknown error.', res && res.technicalDetail);
          }
          isCleaning = false; for (const k in progress) delete progress[k];
          await scan();
        } catch (e) {
          WK.alert('Cleanup failed', errText(e));
        } finally { offP(); offD(); isCleaning = false; for (const k in progress) delete progress[k]; renderAll(); }
      }

      renderAll();
      return {
        show() { scan(); },
        hide() { if (scanOp) WK.native('cleanup_cancel', { opId: scanOp }).catch(() => {}); },
      };
    },
  });
})();

.db-row i.Success{background:var(--wk-success)}.db-row i.Warning{background:var(--wk-warning)}.db-row i.Error{background:var(--wk-error)}

  document.head.append(el('style', { text: css, 'data-db': '' }));

        stxt.textContent = msg;
      }
      async function loadSummary() { try { applySummary(await WK.native('diag_summary')); } catch (_) { applySummary(null); } }

      // ---- overview cards ----
      const v = {};
      const mk = (cls, key) => (v[key] = el('div', { class: cls }));
      const meter = (key) => { const bar = el('i'); v[key] = el('div', { class: 'wk-progress db-meter', role: 'presentation' }, bar); v[key].bar = bar; return v[key]; };
      const card = (label, ...body) => el('div', { class: 'wk-card db-ov' }, el('div', { class: 'db-lbl', text: label }), ...body);

      function setUptime(ms) { if (typeof ms === 'number' && isFinite(ms)) { uptimeBase = ms; uptimeAt = performance.now(); } }

      async function refreshOverview() {

      // ---- quick actions ----

      function stop() {

        while (unsubs.length) { try { unsubs.pop()(); } catch (_) { /* ignore */ } }
      }
      return {
        show() {
          stop();
          updateGreeting(); renderActivity(); renderUptime();
          unsubs.push(

            WK.on('activity:changed', renderActivity),

          return refreshOverview();
        },
        hide() { stop(); }
      };
    }
  });
})();

`;
  const style = el('style', { text: css, 'data-dg': '' });
  document.head.append(style);

  const COLORS = { success: 'var(--wk-success)', accent: 'var(--wk-accent)', warning: 'var(--wk-warning)', error: 'var(--wk-error)', muted: 'var(--wk-text-muted)' };

          el('div', { class: 'wk-secondary dg-sub', text: 'Analyze your system for configuration, integrity, performance, and maintenance issues.' })),

      const runTitle = el('span', { text: 'Running diagnostics...' });
      const runCount = el('span', { class: 'wk-muted' });

        el('div', { class: 'dg-sum' },
          el('div', { class: 'dg-sumtxt' }, sumText, sumCounts),

        const btn = el('button', { class: 'dg-act', onclick: () => onAct(it) });

          el('div', { class: 'dg-main' }, el('div', { class: 'dg-titlerow' }, el('span', { class: 'wk-title', text: result.name || result.checkId }), lbl), sumry, rec, msg, busyBar, logPre, det),

      // ---- list / summary rendering ----
      function renderList() {

        const sorted = vis.map((it, idx) => ({ it, idx })).sort((a, b) => prio(a.it) - prio(b.it) || a.idx - b.idx).map((x) => x.it);
        const groups = new Map();
